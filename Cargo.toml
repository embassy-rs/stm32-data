[workspace]
resolver = "2"
members = [
    "stm32-data-gen",
    "stm32-data-serde",
    "stm32-metapac-gen",
    "stm32-data-macros",
]
exclude = [
    "build"
]

[workspace.package]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
chiptool = { git = "https://github.com/embassy-rs/chiptool", rev = "d54bc66fe9817d2f8d2f8db2505f52716de1d339" }

# Optimize for dev experience: shortest "build+run" time after making a small change.
[profile.release]
debug = true
incremental = true
panic = 'abort'
opt-level = 2
