transforms:
  - !Rename
    from: ^DFSDM1$
    to: DFSDM

  # --------------------
  # Channels
  # --------------------

  - !MakeBlock
    blocks: "DFSDM"
    from: 'DFSDM_CH(CFG|AWSCD|WDAT|DATIN)(\d)(.*)'
    to_outer: CH0
    to_block: CH
    to_inner: $1$3
    # to_inner: "$1$2$3"
    array_on_outer: false

  - !MergeFieldsets
    from: 'DFSDM_CH(CFG|AWSCD|WDAT|DATIN)(\d)(.*)'
    to: 'CHy$1$3'
    check: Names