matches:
  family: STM32C5
peripherals:
  # RM0522 §6.3.5 "Factory calibration" table: VREFINT_CAL at 0x08FFF810,
  # followed by TS_CAL1 (0x08FFF814) and TS_CAL2 (0x08FFF818).
  - name: VREFINTCAL
    address: 0x08FFF810
    registers:
      kind: vrefintcal
      version: v1
      block: VREFINTCAL
