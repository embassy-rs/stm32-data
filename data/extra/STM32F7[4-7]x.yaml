matches:
  chip: STM32F7[4-7].*
peripherals:
  # F74x/F75x (RM0385) and F76x/F77x (RM0410) share this address; F72x/F73x
  # use a different one (see STM32F7[23]x.yaml).
  - name: TS_CAL1
    address: 0x1FF0F44C
    registers:
      kind: tscal
      version: v1
      block: TSCAL
  - name: TS_CAL2
    address: 0x1FF0F44E
    registers:
      kind: tscal
      version: v1
      block: TSCAL
