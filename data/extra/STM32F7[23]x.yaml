matches:
  chip: STM32F7[23].*
peripherals:
  # F72x/F73x (RM0431) use this address; F74x/F75x/F76x/F77x use a different
  # one (see STM32F7[4-7]x.yaml).
  - name: TS_CAL1
    address: 0x1FF07A2C
    registers:
      kind: tscal
      version: v1
      block: TSCAL
  - name: TS_CAL2
    address: 0x1FF07A2E
    registers:
      kind: tscal
      version: v1
      block: TSCAL
