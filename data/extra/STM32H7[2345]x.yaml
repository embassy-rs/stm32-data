matches:
  chip: STM32H7[2345].*
peripherals:
  # H72x/73x/74x/75x share this electronic-signature layout (RM0433/RM0399/
  # RM0468); H7A/B/R/S use a different one (see STM32H7[ABRS]x.yaml).
  - name: TS_CAL1
    address: 0x1FF1E820
    registers:
      kind: tscal
      version: v1
      block: TSCAL
  - name: TS_CAL2
    address: 0x1FF1E840
    registers:
      kind: tscal
      version: v1
      block: TSCAL
