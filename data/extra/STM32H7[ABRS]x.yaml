matches:
  chip: STM32H7[ABRS].*
peripherals:
  # H7A3/H7B3/H7B0/H7R/H7S use this electronic-signature layout (RM0455,
  # RM0477); confirmed via RM0477 for H7R/S, applied to H7A/B by analogy
  # (same "Reserved information" memory-map layout, RM0455 §4.3.14 Table 18).
  - name: TS_CAL1
    address: 0x08FFF814
    registers:
      kind: tscal
      version: v1
      block: TSCAL
  - name: TS_CAL2
    address: 0x08FFF818
    registers:
      kind: tscal
      version: v1
      block: TSCAL
