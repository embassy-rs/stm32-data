matches:
  family: STM32G5
peripherals:
  # Same read-only factory-calibration layout as H5/H7A/B/R/S/C5; RM0443
  # defers calibration addresses to the datasheet, address from
  # stm32g5xx_ll_adc.h (LL_ADC_VREFINT_CAL_ADDR).
  - name: VREFINTCAL
    address: 0x08FFF810
    registers:
      kind: vrefintcal
      version: v1
      block: VREFINTCAL
