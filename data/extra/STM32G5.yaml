matches:
  family: STM32G5
peripherals:
  # Factory calibration values (datasheet §5.3.7):
  # VREFINT_CAL at 30 C (0x08FFF810), TS_CAL1 at 30 C (0x08FFF814),
  # TS_CAL2 at 140 C (0x08FFF818), 12-bit, VDDA = 3.3 V.
  - name: VREFINTCAL
    address: 0x08FFF810
    registers:
      kind: vrefintcal
      version: v1
      block: VREFINTCAL
  - name: TS_CAL1
    address: 0x08FFF814
    registers:
      kind: tscal
      version: v1
      block: TSCAL
  - name: TS_CAL2
    address: 0x08FFF818
    registers:
      kind: tscal
      version: v1
      block: TSCAL
