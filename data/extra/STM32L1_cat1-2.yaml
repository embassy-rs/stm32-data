matches:
  # L100/L151/L152 Cat.1 & Cat.2 devices (flash size 6/8/B), per RM0038.
  # Cat.3/4/5/6 devices (flash size C/D/E) use a different address
  # (see STM32L1_cat3-6.yaml).
  chip: STM32L1(00|5[12])[A-Z][68B](-A)?
peripherals:
  - name: TS_CAL1
    address: 0x1FF8007A
    registers:
      kind: tscal
      version: v1
      block: TSCAL
  - name: TS_CAL2
    address: 0x1FF8007E
    registers:
      kind: tscal
      version: v1
      block: TSCAL
