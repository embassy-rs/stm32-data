    address: 0x1FFF6E68
    registers:
      kind: tscal
      version: v1
      block: TSCAL
  - name: TS_CAL2
    address: 0x1FFF6E8A
    registers:
      kind: tscal
      version: v1
      block: TSCAL
  # Corresponds to tsmc018_ull_opamp_v1_0_L4_Cube, also used for U0
  - name: OPAMP1
    pins:
      - pin: PA0
        signal: VINP0
      - pin: PA1
        signal: VINM0
      - pin: PA3
        signal: VOUT
  - name: OPAMP2
    pins:
      - pin: PA6
        signal: VINP0
      - pin: PA7
        signal: VINM0
      - pin: PB0
        signal: VOUT
