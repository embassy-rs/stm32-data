matches:
  family: STM32U0
peripherals:
  # Corresponds to tsmc018_ull_opamp_v1_0_L4_Cube, also used for U0
  - name: OPAMP1
    pins:
      - pin: PA0
        signal: VINP0
      - pin: PA1
        signal: VINM0
      - pin: PA3
        signal: VOUT
  - name: OPAMP2
    pins:
      - pin: PA6
        signal: VINP0
      - pin: PA7
        signal: VINM0
      - pin: PB0
        signal: VOUT
  # Comparator (COMP) pin channel assignments from DS14463 Rev 2. Table 12.
  # The MCU XML (COMP-TSMC90_U0_Cube_Modes) only has generic INP/INM without channel numbers.
  # Pins not present on a given package are automatically filtered out.
  - name: COMP1
    pins:
      - pin: PC5
        signal: INP0
      - pin: PB2
        signal: INP1
      - pin: PA1
        signal: INP2
      - pin: PA9
        signal: INP3
      - pin: PC6
        signal: INP4
      - pin: PC4
        signal: INM0
      - pin: PB1
        signal: INM1
      - pin: PA0
        signal: INM2
      - pin: PA4
        signal: INM3
      - pin: PA5
        signal: INM3
  - name: COMP2
    pins:
      - pin: PB4
        signal: INP0
      - pin: PB6
        signal: INP1
      - pin: PA3
        signal: INP2
      - pin: PD10
        signal: INP3
      - pin: PB7
        signal: INM0
      - pin: PB3
        signal: INM1
      - pin: PA2
        signal: INM2
  # Factory calibration value for V_refint, from 
  - name: VREFINTCAL
    address: 0x1FFF6EA4
    registers:
      kind: vrefintcal
      version: v1
      block: VREFINTCAL