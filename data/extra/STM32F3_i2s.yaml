matches:
  family: STM32F3
  # Only chips whose headers define I2S2ext/I2S3ext (stm32f3xx.h):
  # F301, F302, F303xB/C/D/E, F318, F358C, F398E.
  # Excluded: F303x6/x8, F328, F334, F373 - no I2S extension hardware.
  chip: STM32F3(?:01|02|18|03[A-Z][BCDE]|58C|98E).*
peripherals:
  # I2S extension blocks (I2S2EXT/I2S3EXT, RM0316) used for full-duplex I2S.
  # The register layout is identical to SPI (stm32f3xx.h casts them to
  # SPI_TypeDef), so they reuse the spi/v3_i2s block. Addresses are taken
  # from I2S2ext_BASE/I2S3ext_BASE in the ST headers.
  #
  # kernel_clock models the RCC_CFGR.I2SSRC mux: while the peripheral is in
  # I2S mode the audio clock is SYSCLK (or the external I2S_CKIN pin), which
  # is resolved at runtime. The main SPI2/SPI3 instances keep their static
  # PCLK1 kernel clock, which is what SPI mode uses.
  - name: I2S2
    address: 0x40003400
    registers:
      kind: spi
      version: v3_i2s
      block: SPI
    rcc:
      bus_clock: PCLK1
      kernel_clock:
        register: CFGR
        field: I2SSRC
      enable:
        register: APB1ENR
        field: SPI2EN
      reset:
        register: APB1RST
        field: SPI2RST
  - name: I2S3
    address: 0x40004000
    registers:
      kind: spi
      version: v3_i2s
      block: SPI
    rcc:
      bus_clock: PCLK1
      kernel_clock:
        register: CFGR
        field: I2SSRC
      enable:
        register: APB1ENR
        field: SPI3EN
      reset:
        register: APB1RST
        field: SPI3RST
