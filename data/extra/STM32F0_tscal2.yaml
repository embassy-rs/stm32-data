matches:
  chip: STM32F0(31|38|42|48|51|58|71|72|78|91|98).*
peripherals:
  # TS_CAL2 only exists on the F0x1/F0x2/F0x8 mainstream line (RM0091);
  # the F030/F070 value line (RM0360) only has TS_CAL1.
  - name: TS_CAL2
    address: 0x1FFFF7C2
    registers:
      kind: tscal
      version: v1
      block: TSCAL
