matches:
  family: STM32F0
peripherals:
  - name: VREFINTCAL
    address: 0x1FFFF7BA
    registers:
      kind: vrefintcal
      version: v1
      block: VREFINTCAL
  # TS_CAL1 exists on all F0 chips (RM0091/RM0360). TS_CAL2 only exists on the
  # F0x1/F0x2/F0x8 mainstream line (see STM32F0_tscal2.yaml overlay); the
  # F030/F070 value line has no second calibration point.
  - name: TS_CAL1
    address: 0x1FFFF7B8
    registers:
      kind: tscal
      version: v1
      block: TSCAL
