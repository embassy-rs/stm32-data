matches:
  family: STM32H5
peripherals:
  # Same read-only factory-calibration layout as H7A/B/R/S and C5: VREFINT_CAL
  # at 0x08FFF810, four bytes before TS_CAL1 (RM0481 leaves 0x08FFF810
  # "Reserved information"; address from stm32h5xx_ll_adc.h).
  - name: VREFINTCAL
    address: 0x08FFF810
    registers:
      kind: vrefintcal
      version: v1
      block: VREFINTCAL
  - name: TS_CAL1
    address: 0x08FFF814
    registers:
      kind: tscal
      version: v1
      block: TSCAL
  - name: TS_CAL2
    address: 0x08FFF818
    registers:
      kind: tscal
      version: v1
      block: TSCAL
  # Corresponds to cmosM40_opamp_v1_0_Cube
  # STM32H5 variant
  - name: OPAMP1
    pins:
      - pin: PC5
        signal: VINM0
      - pin: PB1
        signal: VINM1
      - pin: PB0
        signal: VINP0
      - pin: PA0
        signal: VINP2
      - pin: PA7
        signal: VOUT
  - name: DLYB_SDMMC1
    address: 0x46008400
    registers:
      kind: dlyb
      version: v1
      block: DLYB
  - name: DLYB_OCTOSPI1
    address: 0x4600F000
    registers:
      kind: dlyb
      version: v1
      block: DLYB
