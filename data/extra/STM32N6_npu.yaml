matches:
  family: STM32N6
  chip: STM32N6[45]7.*
peripherals:
  - name: NPU
    address: 0x480E0000
    registers:
      kind: npu
      version: v1
      block: NPU
    interrupts:
      - signal: NPU0
        interrupt: NPU0
      - signal: NPU1
        interrupt: NPU1
      - signal: NPU2
        interrupt: NPU2
      - signal: NPU3
        interrupt: NPU3
