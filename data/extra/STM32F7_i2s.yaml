matches:
  family: STM32F7
peripherals:
  # The F7 I2S blocks have no extension registers; these entries only carry the
  # I2S clock (the dedicated PLLI2S R output) so the I2S driver can resolve it,
  # while SPI2/SPI3 keep their static PCLK1 kernel clock.
  - name: I2S2
    address: 0
    rcc:
      bus_clock: PCLK1
      kernel_clock: PLli2s1_R
      enable:
        register: APB1ENR
        field: SPI2EN
      reset:
        register: APB1RSTR
        field: SPI2RST
  - name: I2S3
    address: 0
    rcc:
      bus_clock: PCLK1
      kernel_clock: PLli2s1_R
      enable:
        register: APB1ENR
        field: SPI3EN
      reset:
        register: APB1RSTR
        field: SPI3RST
