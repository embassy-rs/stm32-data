matches:
  # L100/L151/L152/L162 Cat.3 & Cat.4/5/6 devices (flash size C/D/E), per
  # RM0038. Cat.1/2 devices (flash size 6/8/B) use a different address
  # (see STM32L1_cat1-2.yaml).
  chip: STM32L1(00|5[12]|62)[A-Z][CDE](-[AX])?
peripherals:
  - name: TS_CAL1
    address: 0x1FF800FA
    registers:
      kind: tscal
      version: v1
      block: TSCAL
  - name: TS_CAL2
    address: 0x1FF800FE
    registers:
      kind: tscal
      version: v1
      block: TSCAL
