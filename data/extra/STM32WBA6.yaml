matches:
  chip: STM32WBA6.*
peripherals:
  # DESIG_TSCAL1R/TSCAL2R (RM0515), same register layout as WBA5 but at a
  # different DESIG base address (confirmed via ADC4 calibration table).
  - name: TS_CAL1
    address: 0x0BFA0710
    registers:
      kind: tscal
      version: v1
      block: TSCAL
  - name: TS_CAL2
    address: 0x0BFA0742
    registers:
      kind: tscal
      version: v1
      block: TSCAL
