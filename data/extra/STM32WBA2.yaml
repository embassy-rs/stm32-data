matches:
  chip: STM32WBA2.*
peripherals:
  # DESIG_TSCAL1R/TSCAL2R (RM0521 §22.3 / §42.1), same register layout as
  # WBA5/WBA6 at the WBA2 DESIG base address (0x0BF8D500).
  - name: TS_CAL1
    address: 0x0BF8D710
    registers:
      kind: tscal
      version: v1
      block: TSCAL
  - name: TS_CAL2
    address: 0x0BF8D742
    registers:
      kind: tscal
      version: v1
      block: TSCAL
