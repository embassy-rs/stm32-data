block/COMP:
  description: Comparators.
  items:
  - name: CSR
    description: COMP control and status register.
    byte_offset: 0
    fieldset: CSR
fieldset/CSR:
  description: COMP control and status register.
  fields:
  - name: PU10K
    description: 10 kOhm pull-up resistor.
    bit_offset: 0
    bit_size: 1
  - name: PU400K
    description: 400 kOhm pull-up resistor.
    bit_offset: 1
    bit_size: 1
  - name: PD10K
    description: 10 kOhm pull-down resistor.
    bit_offset: 2
    bit_size: 1
  - name: PD400K
    description: 400 kOhm pull-down resistor.
    bit_offset: 3
    bit_size: 1
  - name: CMP1EN
    description: Comparator 1 enable.
    bit_offset: 4
    bit_size: 1
  - name: SW1
    description: COMP1_SW1 analog switch enable.
    bit_offset: 5
    bit_size: 1
  - name: CMP1OUT
    description: Comparator 1 output.
    bit_offset: 7
    bit_size: 1
  - name: SPEED
    description: Comparator 2 speed mode.
    bit_offset: 12
    bit_size: 1
    enum: Speed
  - name: CMP2OUT
    description: Comparator 2 output.
    bit_offset: 13
    bit_size: 1
  - name: VREFOUTEN
    description: VREFINT output enable.
    bit_offset: 16
    bit_size: 1
  - name: WNDWE
    description: Window mode enable.
    bit_offset: 17
    bit_size: 1
  - name: INSEL
    description: Comparator 2 inverting input selection.
    bit_offset: 18
    bit_size: 3
    enum: INSEL
  - name: OUTSEL
    description: Comparator 2 output redirection.
    bit_offset: 21
    bit_size: 3
    enum: OUTSEL
  - name: FCH3
    description: Select GPIO port PA3 as fast ADC input channel CH3.
    bit_offset: 26
    bit_size: 1
  - name: FCH8
    description: Select GPIO port PB0 as fast ADC input channel CH8.
    bit_offset: 27
    bit_size: 1
  - name: RCH13
    description: Select GPIO port PC3 as re-routed ADC input channel CH13.
    bit_offset: 28
    bit_size: 1
  - name: CAIE
    description: Channel acquisition interrupt enable / clear.
    bit_offset: 29
    bit_size: 1
  - name: CAIF
    description: Channel acquisition interrupt flag.
    bit_offset: 30
    bit_size: 1
  - name: TSUSP
    description: Suspend Timer Mode.
    bit_offset: 31
    bit_size: 1
enum/INSEL:
  bit_size: 3
  variants:
  - name: None
    value: 0
  - name: Pb3
    value: 1
  - name: Vrefint
    value: 2
  - name: ThreeQuarterVrefint
    value: 3
  - name: HalfVrefint
    value: 4
  - name: QuarterVrefint
    value: 5
  - name: DacOut1
    value: 6
  - name: DacOut2
    value: 7
enum/OUTSEL:
  bit_size: 3
  variants:
  - name: Tim2Ic4
    value: 0
  - name: Tim2OcrefClr
    value: 1
  - name: Tim3Ic4
    value: 2
  - name: Tim3OcrefClr
    value: 3
  - name: Tim4Ic4
    value: 4
  - name: Tim4OcrefClr
    value: 5
  - name: Tim10Ic1
    value: 6
  - name: NoRedirection
    value: 7
enum/Speed:
  bit_size: 1
  variants:
  - name: Slow
    description: Slow speed.
    value: 0
  - name: Fast
    description: Fast speed.
    value: 1
