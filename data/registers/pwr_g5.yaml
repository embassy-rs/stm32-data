enum/FLPS:
  bit_size: 1
  variants:
  - name: Normal
    description: flash memory remains in normal mode when the system enters Stop mode (quickrestart time).
    value: 0
  - name: LowPower
    description: flash memory enters low-power mode when the system enters Stop mode(low-power consumption).
    value: 1
enum/LPMS:
  bit_size: 1
  variants:
  - name: Stop
    description: keeps Stop mode when entering DeepSleep.
    value: 0
  - name: Standby
    description: allows Standby mode when entering DeepSleep.
    value: 1
enum/PLS:
  bit_size: 2
  variants:
  - name: Level0
    description: PVD level0.
    value: 0
  - name: Level1
    description: PVD level1.
    value: 1
  - name: PVDInPin
    description: PVD_IN pin.
    value: 3
enum/SRAMPDS:
  bit_size: 1
  variants:
  - name: Preserved
    description: AHB RAM1 content is kept in Stop mode.
    value: 0
  - name: Lost
    description: AHB RAM1 content is lost in Stop mode.
    value: 1
enum/SRAMLS:
  bit_size: 1
  variants:
  - name: HighSpeed
    description: SRAMs operating at high speed (VOS1 or VOS0 voltage scaling).
    value: 0
  - name: LowSpeed
    description: SRAMs operating at low speed (VOS2 voltage scaling).
    value: 1
enum/VOS:
  bit_size: 2
  variants:
  - name: Scale2
    description: 'range 2 (VOS2, default): Low-power range.'
    value: 1
  - name: Scale1
    description: 'range 1: Medium-performance range.'
    value: 2
  - name: Scale0
    description: 'range 0: High-performance range.'
    value: 3
enum/WUPP:
  bit_size: 1
  variants:
  - name: RisingEdge
    description: detection on high level (rising edge).
    value: 0
  - name: FallingEdge
    description: detection on low level (falling edge).
    value: 1
enum/WUPPUPD:
  bit_size: 2
  variants:
  - name: NoPullUp
    value: 0
  - name: PullUp
    value: 1
  - name: PullDown
    value: 2
