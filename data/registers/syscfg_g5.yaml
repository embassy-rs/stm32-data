block/SYSCFG:
  description: SBS register block
  items:
  - name: HDPLCR
    description: SBS temporal isolation control register
    byte_offset: 16
    fieldset: HDPLCR
  - name: HDPLSR
    description: SBS temporal isolation status register
    byte_offset: 20
    access: Read
    fieldset: HDPLSR
  - name: NEXTHDPLCR
    description: SBS next HDPL control register
    byte_offset: 24
    fieldset: NEXTHDPLCR
  - name: DBGCR
    description: SBS debug control register
    byte_offset: 32
    fieldset: DBGCR
  - name: DBGLOCKR
    description: SBS debug lock register
    byte_offset: 36
    fieldset: DBGLOCKR
  - name: DBGCR2
    description: SBS debug control register 2
    byte_offset: 40
    fieldset: DBGCR2
  - name: RSSCMDR
    description: SBS RSS command register
    byte_offset: 52
    fieldset: RSSCMDR
  - name: EPOCHSELCR
    description: SBS EPOCH selection control register
    byte_offset: 160
    fieldset: EPOCHSELCR
  - name: SECCFGR
    description: SBS security mode configuration control register
    byte_offset: 192
    fieldset: SECCFGR
  - name: PMCR
    description: SBS product mode and configuration register
    byte_offset: 256
    fieldset: PMCR
  - name: FPUIMR
    description: SBS FPU interrupt mask register
    byte_offset: 260
    fieldset: FPUIMR
  - name: MESR
    description: SBS memory erase status register
    byte_offset: 264
    fieldset: MESR
  - name: CCCSR
    description: SBS compensation cell for I/Os control and status register
    byte_offset: 272
    fieldset: CCCSR
  - name: CCVALR
    description: SBS compensation cell for I/Os value register
    byte_offset: 276
    access: Read
    fieldset: CCVALR
  - name: CCSWCR
    description: SBS compensation cell for I/Os software code register
    byte_offset: 280
    fieldset: CCSWCR
  - name: CFGR2
    description: SBS Class B register
    byte_offset: 288
    fieldset: CFGR2
  - name: CNSLCKR
    description: SBS CPU non-secure lock register
    byte_offset: 324
    fieldset: CNSLCKR
  - name: CSLCKR
    description: SBS CPU secure lock register
    byte_offset: 328
    fieldset: CSLCKR
  - name: ECCNMIR
    description: SBS FLASH ECC NMI mask register
    byte_offset: 332
    fieldset: ECCNMIR
  - name: SWAPLOCKR
    description: SBS flash bank swap lock register
    byte_offset: 368
    fieldset: SWAPLOCKR
  - name: FBMODER
    description: SBS flash bank mode register
    byte_offset: 372
    fieldset: FBMODER
fieldset/CCCSR:
  description: SBS compensation cell for I/Os control and status register
  fields:
  - name: EN1
    description: Enable compensation cell for VDD power rail.
    bit_offset: 0
    bit_size: 1
  - name: CS1
    description: Code selection for VDD power rail (reset value set to 1).
    bit_offset: 1
    bit_size: 1
    enum: CS
  - name: RDY1
    description: VDD compensation cell ready flag.
    bit_offset: 8
    bit_size: 1
fieldset/CCSWCR:
  description: SBS compensation cell for I/Os software code register
  fields:
  - name: SW_ANSRC1
    description: NMOS compensation code for VDD power rails.
    bit_offset: 0
    bit_size: 4
  - name: SW_APSRC1
    description: PMOS compensation code for VDD power rails.
    bit_offset: 4
    bit_size: 4
fieldset/CCVALR:
  description: SBS compensation cell for I/Os value register
  fields:
  - name: ANSRC1
    description: Compensation value for the NMOS transistor.
    bit_offset: 0
    bit_size: 4
  - name: APSRC1
    description: Compensation value for the PMOS transistor.
    bit_offset: 4
    bit_size: 4
fieldset/CFGR2:
  description: SBS Class B register
  fields:
  - name: CLL
    description: Core lockup lock.
    bit_offset: 0
    bit_size: 1
  - name: SEL
    description: SRAM ECC error lock.
    bit_offset: 1
    bit_size: 1
  - name: PVDL
    description: PVD lock.
    bit_offset: 2
    bit_size: 1
  - name: ECCL
    description: Flash ECC lock.
    bit_offset: 3
    bit_size: 1
  - name: DCECCL
    description: Cortex-M33 D-CACHE ECC lock.
    bit_offset: 4
    bit_size: 1
fieldset/CNSLCKR:
  description: SBS CPU non-secure lock register
  fields:
  - name: LOCKNSVTOR
    description: VTOR_NS register lock.
    bit_offset: 0
    bit_size: 1
  - name: LOCKNSMPU
    description: Non-secure MPU register lock.
    bit_offset: 1
    bit_size: 1
fieldset/CSLCKR:
  description: SBS CPU secure lock register
  fields:
  - name: LOCKSVTAIRCR
    description: VTOR_S and AIRCR register lock.
    bit_offset: 0
    bit_size: 1
  - name: LOCKSMPU
    description: Secure MPU registers lock.
    bit_offset: 1
    bit_size: 1
  - name: LOCKSAU
    description: SAU registers lock.
    bit_offset: 2
    bit_size: 1
fieldset/DBGCR:
  description: SBS debug control register
  fields:
  - name: AP_UNLOCK
    description: Access port unlock. Write 0xB4 to open the device access port.
    bit_offset: 0
    bit_size: 8
  - name: DBG_UNLOCK
    description: Debug unlock when DBG_AUTH_HDPL is reached. Write 0xB4 to open debug.
    bit_offset: 8
    bit_size: 8
  - name: DBG_AUTH_HDPL
    description: Authenticated debug temporal isolation level.
    bit_offset: 16
    bit_size: 8
    enum: DBG_AUTH_HDPL
  - name: DBG_AUTH_SEC
    description: Control debug opening secure/non-secure. Write 0xB4 to open secure and non-secure.
    bit_offset: 24
    bit_size: 8
fieldset/DBGCR2:
  description: SBS debug control register 2
  fields:
  - name: SEC_AP_UNLOCK
    description: Secure AHB access port unlock.
    bit_offset: 0
    bit_size: 8
fieldset/DBGLOCKR:
  description: SBS debug lock register
  fields:
  - name: DBGCFG_LOCK
    description: Debug configuration lock.
    bit_offset: 0
    bit_size: 8
    enum: DBGCFG_LOCK
fieldset/ECCNMIR:
  description: SBS FLASH ECC NMI mask register
  fields:
  - name: ECCNMI_MASK_EN
    description: NMI behavior setup when a double ECC error occurs on FLASH data part.
    bit_offset: 0
    bit_size: 1
fieldset/EPOCHSELCR:
  description: SBS EPOCH selection control register
  fields:
  - name: EPOCH_SEL
    description: Select EPOCH value to be sent to the SAES.
    bit_offset: 0
    bit_size: 2
    enum: EPOCH_SEL
fieldset/FBMODER:
  description: SBS flash bank mode register
  fields:
  - name: FB_MODE
    description: Flash bank mode selection.
    bit_offset: 0
    bit_size: 8
    enum: FB_MODE
fieldset/FPUIMR:
  description: SBS FPU interrupt mask register
  fields:
  - name: FPU_IE
    description: FPU interrupt enable.
    bit_offset: 0
    bit_size: 6
fieldset/HDPLCR:
  description: SBS temporal isolation control register
  fields:
  - name: INCR_HDPL
    description: Increment HDPL value.
    bit_offset: 0
    bit_size: 8
    enum: INCR_HDPL
fieldset/HDPLSR:
  description: SBS temporal isolation status register
  fields:
  - name: HDPL
    description: Temporal isolation level.
    bit_offset: 0
    bit_size: 8
    enum: HDPL
fieldset/MESR:
  description: SBS memory erase status register
  fields:
  - name: MCLR
    description: Device memories erase status.
    bit_offset: 0
    bit_size: 1
  - name: IPMEE
    description: ICACHE and PKA RAM erase status.
    bit_offset: 16
    bit_size: 1
fieldset/NEXTHDPLCR:
  description: SBS next HDPL control register
  fields:
  - name: NEXTHDPL
    description: Index to point to a higher HDPL than the current one.
    bit_offset: 0
    bit_size: 2
fieldset/PMCR:
  description: SBS product mode and configuration register
  fields:
  - name: I2C1SMB3EN
    description: SMBus 3.0 on I2C1 enable.
    bit_offset: 0
    bit_size: 1
  - name: I2C3SMB3EN
    description: SMBus 3.0 on I2C3 enable.
    bit_offset: 2
    bit_size: 1
  - name: I2C4SMB3EN
    description: SMBus 3.0 on I2C4 enable.
    bit_offset: 3
    bit_size: 1
  - name: PB6_FMP
    description: Fast-mode Plus driving capability activation on PB6.
    bit_offset: 16
    bit_size: 1
  - name: PB7_FMP
    description: Fast-mode Plus driving capability activation on PB7.
    bit_offset: 17
    bit_size: 1
  - name: PB9_FMP
    description: Fast-mode Plus driving capability activation on PB9.
    bit_offset: 19
    bit_size: 1
fieldset/RSSCMDR:
  description: SBS RSS command register
  fields:
  - name: RSSCMD
    description: RSS command.
    bit_offset: 0
    bit_size: 16
fieldset/SECCFGR:
  description: SBS security mode configuration control register
  fields:
  - name: SBSSEC
    description: SBS clock control, memory-erase status register and compensation cell register security enable.
    bit_offset: 0
    bit_size: 1
    enum: SEC
  - name: CLASSBSEC
    description: ClassB security enable.
    bit_offset: 1
    bit_size: 1
    enum: SEC
  - name: FPUSEC
    description: FPU security enable.
    bit_offset: 3
    bit_size: 1
    enum: SEC
fieldset/SWAPLOCKR:
  description: SBS flash bank swap lock register
  fields:
  - name: SWAP_LOCK
    description: Flash bank swap operation lock.
    bit_offset: 0
    bit_size: 8
    enum: SWAP_LOCK
enum/CS:
  bit_size: 1
  variants:
  - name: Cell
    description: Code from the cell (available in SBS_CCVALR)
    value: 0
  - name: Software
    description: Code from SBS_CCSWCR
    value: 1
enum/DBGCFG_LOCK:
  bit_size: 8
  variants:
  - name: Allowed
    description: Writes to SBS_DBGCR and SBS_DBGCR2 allowed (default)
    value: 180
enum/DBG_AUTH_HDPL:
  bit_size: 8
  variants:
  - name: HDPL1
    description: HDPL1
    value: 81
  - name: HDPL3
    description: HDPL3
    value: 111
  - name: HDPL2
    description: HDPL2
    value: 138
enum/EPOCH_SEL:
  bit_size: 2
  variants:
  - name: NS_EPOCH
    description: NS_EPOCH (non-secure) counter input selected
    value: 0
  - name: SEC_EPOCH
    description: SEC_EPOCH counter input selected
    value: 1
enum/FB_MODE:
  bit_size: 8
  variants:
  - name: Bank2First
    description: Flash Bank 2 mapped at 0x0800 0000 and Bank 1 at 0x0804 0000
    value: 180
  - name: Bank1First
    description: Flash Bank 1 mapped at 0x0800 0000 and Bank 2 at 0x0804 0000
    value: 195
enum/HDPL:
  bit_size: 8
  variants:
  - name: HDPL1
    description: HDPL1, iRoT
    value: 81
  - name: HDPL3
    description: HDPL3, application (secure/non-secure)
    value: 111
  - name: HDPL2
    description: HDPL2, uRoT
    value: 138
  - name: HDPL0
    description: HDPL0, RSS
    value: 180
enum/INCR_HDPL:
  bit_size: 8
  variants:
  - name: Increment
    description: Recommended value to increment HDPL level by one
    value: 106
  - name: NoIncrement
    description: No increment
    value: 180
enum/SEC:
  bit_size: 1
  variants:
  - name: Any
    description: Register accessible through secure or non-secure transaction
    value: 0
  - name: Secure
    description: Register only accessible through secure transaction
    value: 1
enum/SWAP_LOCK:
  bit_size: 8
  variants:
  - name: Blocked
    description: Flash bank swap operation not allowed
    value: 180
  - name: Allowed
    description: Flash bank swap operation allowed
    value: 195
