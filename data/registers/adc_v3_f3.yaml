block/ADC:
  description: Analog-to-digital converter
  items:
  - name: ISR
    description: Interrupt and status register
    byte_offset: 0
    fieldset: ISR
  - name: IER
    description: Interrupt enable register
    byte_offset: 4
    fieldset: IER
  - name: CR
    description: Control register
    byte_offset: 8
    fieldset: CR
  - name: CFGR
    description: Configuration register
    byte_offset: 12
    fieldset: CFGR
  - name: SMPR
    description: Sample time register. SMPR[i] holds the sample times of channels 10*i to 10*i+9.
    array:
      len: 2
      stride: 4
    byte_offset: 20
    fieldset: SMPR
  - name: TR
    description: Analog watchdog threshold register. TR[1] and TR[2] (watchdogs 2 and 3) only use the 8 most significant bits of each threshold.
    array:
      len: 3
      stride: 4
    byte_offset: 32
    fieldset: TR
  - name: SQR1
    description: Regular sequence register 1 (length and conversions 1 to 4)
    byte_offset: 48
    fieldset: SQR1
  - name: SQR2
    description: Regular sequence register 2 (conversions 5 to 9)
    byte_offset: 52
    fieldset: SQR2
  - name: SQR3
    description: Regular sequence register 3 (conversions 10 to 14)
    byte_offset: 56
    fieldset: SQR3
  - name: SQR4
    description: Regular sequence register 4 (conversions 15 to 16)
    byte_offset: 60
    fieldset: SQR4
  - name: DR
    description: Regular data register
    byte_offset: 64
    access: Read
    fieldset: DR
  - name: JSQR
    description: Injected sequence register
    byte_offset: 76
    fieldset: JSQR
  - name: OFR
    description: Offset register
    array:
      len: 4
      stride: 4
    byte_offset: 96
    fieldset: OFR
  - name: JDR
    description: Injected data register
    array:
      len: 4
      stride: 4
    byte_offset: 128
    access: Read
    fieldset: JDR
  - name: AWD2CR
    description: Analog watchdog 2 configuration register
    byte_offset: 160
    fieldset: AWD2CR
  - name: AWD3CR
    description: Analog watchdog 3 configuration register
    byte_offset: 164
    fieldset: AWD3CR
  - name: DIFSEL
    description: Differential mode selection register
    byte_offset: 176
    fieldset: DIFSEL
  - name: CALFACT
    description: Calibration factors register
    byte_offset: 180
    fieldset: CALFACT
fieldset/AWD2CR:
  description: Analog watchdog 2 configuration register
  fields:
  - name: AWD2CH
    description: Analog watchdog 2 channel-x selection
    bit_offset: 0
    bit_size: 1
    array:
      len: 19
      stride: 1
fieldset/AWD3CR:
  description: Analog watchdog 3 configuration register
  fields:
  - name: AWD3CH
    description: Analog watchdog 3 channel-x selection
    bit_offset: 0
    bit_size: 1
    array:
      len: 19
      stride: 1
fieldset/CALFACT:
  description: Calibration factors register
  fields:
  - name: CALFACT_S
    description: Calibration factor in single-ended mode
    bit_offset: 0
    bit_size: 7
  - name: CALFACT_D
    description: Calibration factor in differential mode
    bit_offset: 16
    bit_size: 7
fieldset/CFGR:
  description: Configuration register
  fields:
  - name: DMAEN
    description: Direct memory access enable
    bit_offset: 0
    bit_size: 1
  - name: DMACFG
    description: Direct memory access configuration
    bit_offset: 1
    bit_size: 1
    enum: DMACFG
  - name: RES
    description: Data resolution
    bit_offset: 3
    bit_size: 2
    enum: RES
  - name: ALIGN
    description: Data alignment
    bit_offset: 5
    bit_size: 1
    enum: ALIGN
  - name: EXTSEL
    description: External trigger selection for regular group
    bit_offset: 6
    bit_size: 4
  - name: EXTEN
    description: External trigger enable and polarity selection for regular channels
    bit_offset: 10
    bit_size: 2
    enum: EXTEN
  - name: OVRMOD
    description: 'Overrun mode (0: ADC_DR is preserved when an overrun is detected, 1: ADC_DR is overwritten with the last conversion result)'
    bit_offset: 12
    bit_size: 1
  - name: CONT
    description: Continuous conversion mode for regular conversions
    bit_offset: 13
    bit_size: 1
  - name: AUTDLY
    description: Delayed conversion mode
    bit_offset: 14
    bit_size: 1
  - name: AUTOFF
    description: Auto-off mode
    bit_offset: 15
    bit_size: 1
  - name: DISCEN
    description: Discontinuous mode for regular channels
    bit_offset: 16
    bit_size: 1
  - name: DISCNUM
    description: Discontinuous mode channel count
    bit_offset: 17
    bit_size: 3
  - name: JDISCEN
    description: Discontinuous mode on injected channels
    bit_offset: 20
    bit_size: 1
  - name: JQM
    description: JSQR queue mode
    bit_offset: 21
    bit_size: 1
  - name: AWD1SGL
    description: Enable the analog watchdog 1 on a single channel (1) or on all channels (0)
    bit_offset: 22
    bit_size: 1
  - name: AWD1EN
    description: Analog watchdog 1 enable on regular channels
    bit_offset: 23
    bit_size: 1
  - name: JAWD1EN
    description: Analog watchdog 1 enable on injected channels
    bit_offset: 24
    bit_size: 1
  - name: JAUTO
    description: Automatic injected group conversion
    bit_offset: 25
    bit_size: 1
  - name: AWD1CH
    description: Analog watchdog 1 channel selection
    bit_offset: 26
    bit_size: 5
fieldset/CR:
  description: Control register
  fields:
  - name: ADEN
    description: ADC enable
    bit_offset: 0
    bit_size: 1
  - name: ADDIS
    description: ADC disable
    bit_offset: 1
    bit_size: 1
  - name: ADSTART
    description: Regular conversions start
    bit_offset: 2
    bit_size: 1
  - name: JADSTART
    description: Injected conversions start
    bit_offset: 3
    bit_size: 1
  - name: ADSTP
    description: Regular conversions stop
    bit_offset: 4
    bit_size: 1
  - name: JADSTP
    description: Injected conversions stop
    bit_offset: 5
    bit_size: 1
  - name: ADVREGEN
    description: ADC voltage regulator enable
    bit_offset: 28
    bit_size: 1
  - name: DEEPPWD
    description: Deep-power-down enable
    bit_offset: 29
    bit_size: 1
  - name: ADCALDIF
    description: 'Differential mode for calibration (0: single-ended, 1: differential)'
    bit_offset: 30
    bit_size: 1
  - name: ADCAL
    description: ADC calibration
    bit_offset: 31
    bit_size: 1
fieldset/DIFSEL:
  description: Differential mode selection register
  fields:
  - name: DIFSEL
    description: 'Differential mode for channel x (0: single-ended, 1: differential)'
    bit_offset: 0
    bit_size: 1
    array:
      len: 19
      stride: 1
fieldset/DR:
  description: Regular data register
  fields:
  - name: RDATA
    description: Regular data converted
    bit_offset: 0
    bit_size: 16
fieldset/IER:
  description: Interrupt enable register
  fields:
  - name: ADRDYIE
    description: ADC ready interrupt enable
    bit_offset: 0
    bit_size: 1
  - name: EOSMPIE
    description: End of sampling interrupt enable
    bit_offset: 1
    bit_size: 1
  - name: EOCIE
    description: End of regular conversion interrupt enable
    bit_offset: 2
    bit_size: 1
  - name: EOSIE
    description: End of regular sequence interrupt enable
    bit_offset: 3
    bit_size: 1
  - name: OVRIE
    description: Overrun interrupt enable
    bit_offset: 4
    bit_size: 1
  - name: JEOCIE
    description: End of injected conversion interrupt enable
    bit_offset: 5
    bit_size: 1
  - name: JEOSIE
    description: End of injected sequence interrupt enable
    bit_offset: 6
    bit_size: 1
  - name: AWDIE
    description: Analog watchdog interrupt enable
    bit_offset: 7
    bit_size: 1
    array:
      len: 3
      stride: 1
  - name: JQOVFIE
    description: Injected context queue overflow interrupt enable
    bit_offset: 10
    bit_size: 1
fieldset/ISR:
  description: Interrupt and status register
  fields:
  - name: ADRDY
    description: ADC ready flag
    bit_offset: 0
    bit_size: 1
  - name: EOSMP
    description: End of sampling flag
    bit_offset: 1
    bit_size: 1
  - name: EOC
    description: End of regular conversion flag
    bit_offset: 2
    bit_size: 1
  - name: EOS
    description: End of regular sequence flag
    bit_offset: 3
    bit_size: 1
  - name: OVR
    description: Overrun flag
    bit_offset: 4
    bit_size: 1
  - name: JEOC
    description: End of injected conversion flag
    bit_offset: 5
    bit_size: 1
  - name: JEOS
    description: End of injected sequence flag
    bit_offset: 6
    bit_size: 1
  - name: AWD
    description: Analog watchdog flag
    bit_offset: 7
    bit_size: 1
    array:
      len: 3
      stride: 1
  - name: JQOVF
    description: Injected context queue overflow flag
    bit_offset: 10
    bit_size: 1
fieldset/JDR:
  description: Injected data register
  fields:
  - name: JDATA
    description: Injected data
    bit_offset: 0
    bit_size: 16
fieldset/JSQR:
  description: Injected sequence register
  fields:
  - name: JL
    description: Injected channel sequence length
    bit_offset: 0
    bit_size: 2
  - name: JEXTSEL
    description: External trigger selection for injected group
    bit_offset: 2
    bit_size: 4
  - name: JEXTEN
    description: External trigger enable and polarity selection for injected channels
    bit_offset: 6
    bit_size: 2
    enum: EXTEN
  - name: JSQ
    description: Conversion in the injected sequence
    bit_offset: 8
    bit_size: 5
    array:
      len: 4
      stride: 6
fieldset/OFR:
  description: Offset register
  fields:
  - name: OFFSET
    description: Data offset y for the channel programmed into OFFSET_CH
    bit_offset: 0
    bit_size: 12
  - name: OFFSET_CH
    description: Channel selection for the data offset y
    bit_offset: 26
    bit_size: 5
  - name: OFFSET_EN
    description: Offset y enable
    bit_offset: 31
    bit_size: 1
fieldset/SMPR:
  description: Sample time register
  fields:
  - name: SMP
    description: Channel x sampling time selection
    bit_offset: 0
    bit_size: 3
    array:
      len: 10
      stride: 3
    enum: SAMPLE_TIME
fieldset/SQR1:
  description: Regular sequence register 1
  fields:
  - name: L
    description: Regular channel sequence length
    bit_offset: 0
    bit_size: 4
  - name: SQ
    description: Conversion in regular sequence
    bit_offset: 6
    bit_size: 5
    array:
      len: 4
      stride: 6
fieldset/SQR2:
  description: Regular sequence register 2
  fields:
  - name: SQ
    description: Conversion in regular sequence
    bit_offset: 0
    bit_size: 5
    array:
      len: 5
      stride: 6
fieldset/SQR3:
  description: Regular sequence register 3
  fields:
  - name: SQ
    description: Conversion in regular sequence
    bit_offset: 0
    bit_size: 5
    array:
      len: 5
      stride: 6
fieldset/SQR4:
  description: Regular sequence register 4
  fields:
  - name: SQ
    description: Conversion in regular sequence
    bit_offset: 0
    bit_size: 5
    array:
      len: 2
      stride: 6
fieldset/TR:
  description: Analog watchdog threshold register
  fields:
  - name: LT
    description: Analog watchdog lower threshold
    bit_offset: 0
    bit_size: 12
  - name: HT
    description: Analog watchdog higher threshold
    bit_offset: 16
    bit_size: 12
enum/ALIGN:
  bit_size: 1
  variants:
  - name: Right
    description: Right alignment
    value: 0
  - name: Left
    description: Left alignment
    value: 1
enum/DMACFG:
  bit_size: 1
  variants:
  - name: OneShot
    description: DMA one shot mode selected
    value: 0
  - name: Circular
    description: DMA circular mode selected
    value: 1
enum/EXTEN:
  bit_size: 2
  variants:
  - name: Disabled
    description: Hardware trigger detection disabled (conversions can be launched by software)
    value: 0
  - name: RisingEdge
    description: Hardware trigger detection on the rising edge
    value: 1
  - name: FallingEdge
    description: Hardware trigger detection on the falling edge
    value: 2
  - name: BothEdges
    description: Hardware trigger detection on both the rising and falling edges
    value: 3
enum/RES:
  bit_size: 2
  variants:
  - name: Bits12
    description: 12-bit
    value: 0
  - name: Bits10
    description: 10-bit
    value: 1
  - name: Bits8
    description: 8-bit
    value: 2
  - name: Bits6
    description: 6-bit
    value: 3
enum/SAMPLE_TIME:
  bit_size: 3
  variants:
  - name: Cycles1_5
    description: 1.5 ADC clock cycles
    value: 0
  - name: Cycles2_5
    description: 2.5 ADC clock cycles
    value: 1
  - name: Cycles4_5
    description: 4.5 ADC clock cycles
    value: 2
  - name: Cycles7_5
    description: 7.5 ADC clock cycles
    value: 3
  - name: Cycles19_5
    description: 19.5 ADC clock cycles
    value: 4
  - name: Cycles61_5
    description: 61.5 ADC clock cycles
    value: 5
  - name: Cycles181_5
    description: 181.5 ADC clock cycles
    value: 6
  - name: Cycles601_5
    description: 601.5 ADC clock cycles
    value: 7
