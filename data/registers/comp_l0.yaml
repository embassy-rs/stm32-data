block/COMP1:
  description: Comparator 1.
  items:
  - name: CSR
    description: COMP1 control and status register.
    byte_offset: 0
    fieldset: CSR1
block/COMP2:
  description: Comparator 2.
  items:
  - name: CSR
    description: COMP2 control and status register.
    byte_offset: 0
    fieldset: CSR2
fieldset/CSR1:
  description: COMP1 control and status register.
  fields:
  - name: EN
    description: COMP1 enable bit.
    bit_offset: 0
    bit_size: 1
  - name: INNSEL
    description: COMP1 input minus selection.
    bit_offset: 4
    bit_size: 2
    enum: COMP1_INNSEL
  - name: WM
    description: COMP1 window mode selection bit.
    bit_offset: 8
    bit_size: 1
  - name: LPTIMIN1
    description: COMP1 LPTIM1 input 1 propagation bit.
    bit_offset: 12
    bit_size: 1
  - name: POLARITY
    description: COMP1 output polarity selection bit.
    bit_offset: 15
    bit_size: 1
    enum: Polarity
  - name: VALUE
    description: COMP1 output status bit.
    bit_offset: 30
    bit_size: 1
  - name: LOCK
    description: COMP1_CSR register lock bit.
    bit_offset: 31
    bit_size: 1
fieldset/CSR2:
  description: COMP2 control and status register.
  fields:
  - name: EN
    description: COMP2 enable bit.
    bit_offset: 0
    bit_size: 1
  - name: SPEED
    description: COMP2 power mode selection bit.
    bit_offset: 3
    bit_size: 1
    enum: Speed
  - name: INNSEL
    description: COMP2 input minus selection.
    bit_offset: 4
    bit_size: 3
    enum: COMP2_INNSEL
  - name: INPSEL
    description: COMP2 input plus selection.
    bit_offset: 8
    bit_size: 3
    enum: COMP2_INPSEL
  - name: LPTIMIN2
    description: COMP2 LPTIM1 input 2 propagation bit.
    bit_offset: 12
    bit_size: 1
  - name: LPTIMIN1
    description: COMP2 LPTIM1 input 1 propagation bit.
    bit_offset: 13
    bit_size: 1
  - name: POLARITY
    description: COMP2 output polarity selection bit.
    bit_offset: 15
    bit_size: 1
    enum: Polarity
  - name: VALUE
    description: COMP2 output status bit.
    bit_offset: 30
    bit_size: 1
  - name: LOCK
    description: COMP2_CSR register lock bit.
    bit_offset: 31
    bit_size: 1
enum/COMP1_INNSEL:
  bit_size: 2
  variants:
  - name: Vrefint
    value: 0
  - name: Pa0
    value: 1
  - name: Pa4
    value: 2
  - name: Pa5
    value: 3
enum/COMP2_INNSEL:
  bit_size: 3
  variants:
  - name: Vrefint
    value: 0
  - name: Pa2
    value: 1
  - name: Pa4
    value: 2
  - name: Pa5
    value: 3
  - name: QuarterVrefint
    value: 4
  - name: HalfVrefint
    value: 5
  - name: ThreeQuarterVrefint
    value: 6
  - name: Pb3
    value: 7
enum/COMP2_INPSEL:
  bit_size: 3
  variants:
  - name: Pa3
    value: 0
  - name: Pb4
    value: 1
  - name: Pb5
    value: 2
  - name: Pb6
    value: 3
  - name: Pb7
    value: 4
  - name: Pa7
    value: 5
enum/Polarity:
  bit_size: 1
  variants:
  - name: NotInverted
    description: Output is not inverted.
    value: 0
  - name: Inverted
    description: Output is inverted.
    value: 1
enum/Speed:
  bit_size: 1
  variants:
  - name: Slow
    description: Slow speed.
    value: 0
  - name: Fast
    description: Fast speed.
    value: 1
