    description: ECC fail bank for double ECC error.
    bit_offset: 22
    bit_size: 1
  - name: SYSF_ECC
    description: Double ECC error detected in system flash memory.
    bit_offset: 23
    bit_size: 1
  - name: OTP_ECC
    description: OTP ECC error bit.
    bit_offset: 24
    bit_size: 1
  - name: ECCD
    description: ECC double detection flag (cleared by writing 1).
    bit_offset: 31
    bit_size: 1
fieldset/ECCDR:
  description: FLASH ECC data.
  fields:
  - name: DATA_ECC
    description: ECC error data.
    bit_offset: 0
    bit_size: 16
fieldset/EDATA:
