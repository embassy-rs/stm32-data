    description: OTP ECC error bit.
    bit_offset: 24
    bit_size: 1
  - name: ECCCIE
    description: ECC single correction error interrupt enable bit.
    bit_offset: 25
    bit_size: 1
  - name: ECCC
    description: ECC correction flag (cleared by writing 1).
    bit_offset: 30
    bit_size: 1
fieldset/ECCDETR:
  description: FLASH ECC detection register.
  fields:
  - name: ADDR_ECC
    description: ECC error address.
    bit_offset: 0
    bit_size: 16
