fieldset/ACR:
  description: FLASH access control register.
  fields:
  - name: LATENCY
    description: Read latency.
    bit_offset: 0
    bit_size: 4
  - name: WRHIGHFREQ
    description: Flash signal delay.
    bit_offset: 4
    bit_size: 2
  - name: PRFTEN
    description: Prefetch enable.
    bit_offset: 8
    bit_size: 1
  - name: ACR_SEC_EN
    description: Restrict FLASH_ACR from non-secure write access.
    bit_offset: 16
    bit_size: 1
fieldset/BL_COM_CFG:
  description: FLASH bootloader interface selection.
  fields:
  - name: BL_COM_CFG
    description: Bootloader interface selection/configuration.
    bit_offset: 0
    bit_size: 32
fieldset/BOOTR:
