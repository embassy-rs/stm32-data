    description: Single ECC error corrected in flash OB Keys storage area.
    bit_offset: 20
    bit_size: 1
  - name: EDATA_ECC
    description: Single ECC error corrected in flash high-cycle data area.
    bit_offset: 21
    bit_size: 1
  - name: BK_ECC
    description: ECC fail bank for corrected ECC error.
    bit_offset: 22
    bit_size: 1
  - name: SYSF_ECC
    description: Single ECC error corrected in system flash memory.
    bit_offset: 23
    bit_size: 1
