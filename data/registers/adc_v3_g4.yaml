block/ADC:
  description: Analog-to-digital converter
  items:
  - name: ISR
    description: Interrupt and status register
    byte_offset: 0
    fieldset: ISR
  - name: IER
    description: Interrupt enable register
    byte_offset: 4
    fieldset: IER
  - name: CR
    description: Control register
    byte_offset: 8
    fieldset: CR
  - name: CFGR
    description: Configuration register
    byte_offset: 12
    fieldset: CFGR
  - name: CFGR2
    description: Configuration register 2
    byte_offset: 16
    fieldset: CFGR2
  - name: SMPR
    description: Sample time register. SMPR[i] holds the sample times of channels 10*i to 10*i+9.
    array:
      len: 2
      stride: 4
    byte_offset: 20
    fieldset: SMPR
  - name: TR
    description: Analog watchdog threshold register. TR[1] and TR[2] (watchdogs 2 and 3) only use the 8 most significant bits of each threshold.
    array:
      len: 3
      stride: 4
    byte_offset: 32
    fieldset: TR
  - name: SQR1
    description: Regular sequence register 1 (length and conversions 1 to 4)
    byte_offset: 48
    fieldset: SQR1
  - name: SQR2
    description: Regular sequence register 2 (conversions 5 to 9)
    byte_offset: 52
    fieldset: SQR2
  - name: SQR3
    description: Regular sequence register 3 (conversions 10 to 14)
    byte_offset: 56
    fieldset: SQR3
  - name: SQR4
    description: Regular sequence register 4 (conversions 15 to 16)
    byte_offset: 60
    fieldset: SQR4
  - name: DR
    description: Regular data register
    byte_offset: 64
    access: Read
    fieldset: DR
  - name: JSQR
    description: Injected sequence register
    byte_offset: 76
    fieldset: JSQR
  - name: OFR
    description: Offset register
    array:
      len: 4
      stride: 4
    byte_offset: 96
    fieldset: OFR
  - name: JDR
    description: Injected data register
    array:
      len: 4
      stride: 4
    byte_offset: 128
    access: Read
    fieldset: JDR
  - name: AWD2CR
    description: Analog watchdog 2 configuration register
    byte_offset: 160
    fieldset: AWD2CR
  - name: AWD3CR
    description: Analog watchdog 3 configuration register
    byte_offset: 164
    fieldset: AWD3CR
  - name: DIFSEL
    description: Differential mode selection register
    byte_offset: 176
    fieldset: DIFSEL
  - name: CALFACT
    description: Calibration factors register
    byte_offset: 180
    fieldset: CALFACT
  - name: GCOMP
    description: Gain compensation register (STM32G4 only)
    byte_offset: 192
    fieldset: GCOMP
  - name: OR
    description: Option register (STM32H5 and STM32H7RS only)
    byte_offset: 200
    fieldset: OR
fieldset/AWD2CR:
  description: Analog watchdog 2 configuration register
  fields:
  - name: AWD2CH
    description: Analog watchdog 2 channel-x selection
    bit_offset: 0
    bit_size: 1
    array:
      len: 20
      stride: 1
fieldset/AWD3CR:
  description: Analog watchdog 3 configuration register
  fields:
  - name: AWD3CH
    description: Analog watchdog 3 channel-x selection
    bit_offset: 0
    bit_size: 1
    array:
      len: 20
      stride: 1
fieldset/CALFACT:
  description: Calibration factors register
  fields:
  - name: CALFACT_S
    description: Calibration factor in single-ended mode
    bit_offset: 0
    bit_size: 7
  - name: CALFACT_D
    description: Calibration factor in differential mode
    bit_offset: 16
    bit_size: 7
fieldset/CFGR:
  description: Configuration register
  fields:
  - name: DMAEN
    description: Direct memory access enable
    bit_offset: 0
    bit_size: 1
  - name: DMACFG
    description: Direct memory access configuration
    bit_offset: 1
    bit_size: 1
    enum: DMACFG
  - name: ADFCFG
    description: Digital filter (ADF) configuration (STM32H7RS only)
    bit_offset: 2
    bit_size: 1
  - name: RES
    description: Data resolution
    bit_offset: 3
    bit_size: 2
    enum: RES
  - name: EXTSEL
    description: External trigger selection for regular group
    bit_offset: 5
    bit_size: 5
  - name: EXTEN
    description: External trigger enable and polarity selection for regular channels
    bit_offset: 10
    bit_size: 2
    enum: EXTEN
  - name: OVRMOD
    description: 'Overrun mode (0: ADC_DR is preserved when an overrun is detected, 1: ADC_DR is overwritten with the last conversion result)'
    bit_offset: 12
    bit_size: 1
  - name: CONT
    description: Continuous conversion mode for regular conversions
    bit_offset: 13
    bit_size: 1
  - name: AUTDLY
    description: Delayed conversion mode
    bit_offset: 14
    bit_size: 1
  - name: ALIGN
    description: Data alignment
    bit_offset: 15
    bit_size: 1
    enum: ALIGN
  - name: DISCEN
    description: Discontinuous mode for regular channels
    bit_offset: 16
    bit_size: 1
  - name: DISCNUM
    description: Discontinuous mode channel count
    bit_offset: 17
    bit_size: 3
  - name: JDISCEN
    description: Discontinuous mode on injected channels
    bit_offset: 20
    bit_size: 1
  - name: JQM
    description: JSQR queue mode
    bit_offset: 21
    bit_size: 1
  - name: AWD1SGL
    description: Enable the analog watchdog 1 on a single channel (1) or on all channels (0)
    bit_offset: 22
    bit_size: 1
  - name: AWD1EN
    description: Analog watchdog 1 enable on regular channels
    bit_offset: 23
    bit_size: 1
  - name: JAWD1EN
    description: Analog watchdog 1 enable on injected channels
    bit_offset: 24
    bit_size: 1
  - name: JAUTO
    description: Automatic injected group conversion
    bit_offset: 25
    bit_size: 1
  - name: AWD1CH
    description: Analog watchdog 1 channel selection
    bit_offset: 26
    bit_size: 5
  - name: JQDIS
    description: Injected queue disable
    bit_offset: 31
    bit_size: 1
fieldset/CFGR2:
  description: Configuration register 2
  fields:
  - name: ROVSE
    description: Regular oversampling enable
    bit_offset: 0
    bit_size: 1
  - name: JOVSE
    description: Injected oversampling enable
    bit_offset: 1
    bit_size: 1
  - name: OVSR
    description: Oversampling ratio
    bit_offset: 2
    bit_size: 3
    enum: OVSR
  - name: OVSS
    description: Oversampling shift (number of bits to right-shift the accumulated result)
    bit_offset: 5
    bit_size: 4
  - name: TROVS
    description: Triggered regular oversampling
    bit_offset: 9
    bit_size: 1
    enum: TROVS
  - name: ROVSM
    description: Regular oversampling mode
    bit_offset: 10
    bit_size: 1
    enum: ROVSM
  - name: GCOMP
    description: Gain compensation mode
    bit_offset: 16
    bit_size: 1
  - name: SWTRIG
    description: Software trigger bit for sampling time control trigger mode
    bit_offset: 25
    bit_size: 1
    enum: SWTRIG
  - name: BULB
    description: Bulb sampling mode
    bit_offset: 26
    bit_size: 1
  - name: SMPTRIG
    description: Sampling time control trigger mode
    bit_offset: 27
    bit_size: 1
  - name: LFTRIG
    description: Low frequency trigger mode enable (STM32H5 only)
    bit_offset: 29
    bit_size: 1
fieldset/CR:
  description: Control register
  fields:
  - name: ADEN
    description: ADC enable
    bit_offset: 0
    bit_size: 1
  - name: ADDIS
    description: ADC disable
    bit_offset: 1
    bit_size: 1
  - name: ADSTART
    description: Regular conversions start
    bit_offset: 2
    bit_size: 1
  - name: JADSTART
    description: Injected conversions start
    bit_offset: 3
    bit_size: 1
  - name: ADSTP
    description: Regular conversions stop
    bit_offset: 4
    bit_size: 1
  - name: JADSTP
    description: Injected conversions stop
    bit_offset: 5
    bit_size: 1
  - name: ADVREGEN
    description: ADC voltage regulator enable
    bit_offset: 28
    bit_size: 1
  - name: DEEPPWD
    description: Deep-power-down enable
    bit_offset: 29
    bit_size: 1
  - name: ADCALDIF
    description: 'Differential mode for calibration (0: single-ended, 1: differential)'
    bit_offset: 30
    bit_size: 1
  - name: ADCAL
    description: ADC calibration
    bit_offset: 31
    bit_size: 1
fieldset/DIFSEL:
  description: Differential mode selection register
  fields:
  - name: DIFSEL
    description: 'Differential mode for channel x (0: single-ended, 1: differential)'
    bit_offset: 0
    bit_size: 1
    array:
      len: 20
      stride: 1
fieldset/DR:
  description: Regular data register
  fields:
  - name: RDATA
    description: Regular data converted
    bit_offset: 0
    bit_size: 16
fieldset/GCOMP:
  description: Gain compensation register
  fields:
  - name: GCOMPCOEFF
    description: Gain compensation coefficient
    bit_offset: 0
    bit_size: 14
fieldset/IER:
  description: Interrupt enable register
  fields:
  - name: ADRDYIE
    description: ADC ready interrupt enable
    bit_offset: 0
    bit_size: 1
  - name: EOSMPIE
    description: End of sampling interrupt enable
    bit_offset: 1
    bit_size: 1
  - name: EOCIE
    description: End of regular conversion interrupt enable
    bit_offset: 2
    bit_size: 1
  - name: EOSIE
    description: End of regular sequence interrupt enable
    bit_offset: 3
    bit_size: 1
  - name: OVRIE
    description: Overrun interrupt enable
    bit_offset: 4
    bit_size: 1
  - name: JEOCIE
    description: End of injected conversion interrupt enable
    bit_offset: 5
    bit_size: 1
  - name: JEOSIE
    description: End of injected sequence interrupt enable
    bit_offset: 6
    bit_size: 1
  - name: AWDIE
    description: Analog watchdog interrupt enable
    bit_offset: 7
    bit_size: 1
    array:
      len: 3
      stride: 1
  - name: JQOVFIE
    description: Injected context queue overflow interrupt enable
    bit_offset: 10
    bit_size: 1
fieldset/ISR:
  description: Interrupt and status register
  fields:
  - name: ADRDY
    description: ADC ready flag
    bit_offset: 0
    bit_size: 1
  - name: EOSMP
    description: End of sampling flag
    bit_offset: 1
    bit_size: 1
  - name: EOC
    description: End of regular conversion flag
    bit_offset: 2
    bit_size: 1
  - name: EOS
    description: End of regular sequence flag
    bit_offset: 3
    bit_size: 1
  - name: OVR
    description: Overrun flag
    bit_offset: 4
    bit_size: 1
  - name: JEOC
    description: End of injected conversion flag
    bit_offset: 5
    bit_size: 1
  - name: JEOS
    description: End of injected sequence flag
    bit_offset: 6
    bit_size: 1
  - name: AWD
    description: Analog watchdog flag
    bit_offset: 7
    bit_size: 1
    array:
      len: 3
      stride: 1
  - name: JQOVF
    description: Injected context queue overflow flag
    bit_offset: 10
    bit_size: 1
fieldset/JDR:
  description: Injected data register
  fields:
  - name: JDATA
    description: Injected data
    bit_offset: 0
    bit_size: 16
fieldset/JSQR:
  description: Injected sequence register
  fields:
  - name: JL
    description: Injected channel sequence length
    bit_offset: 0
    bit_size: 2
  - name: JEXTSEL
    description: External trigger selection for injected group
    bit_offset: 2
    bit_size: 5
  - name: JEXTEN
    description: External trigger enable and polarity selection for injected channels
    bit_offset: 7
    bit_size: 2
    enum: EXTEN
  - name: JSQ
    description: Conversion in the injected sequence
    bit_offset: 9
    bit_size: 5
    array:
      len: 4
      stride: 6
fieldset/OFR:
  description: Offset register
  fields:
  - name: OFFSET
    description: Data offset y for the channel programmed into OFFSET_CH
    bit_offset: 0
    bit_size: 12
  - name: OFFSETPOS
    description: 'Positive offset (0: the offset is subtracted, 1: the offset is added)'
    bit_offset: 24
    bit_size: 1
  - name: SATEN
    description: Saturation enable
    bit_offset: 25
    bit_size: 1
  - name: OFFSET_CH
    description: Channel selection for the data offset y
    bit_offset: 26
    bit_size: 5
  - name: OFFSET_EN
    description: Offset y enable
    bit_offset: 31
    bit_size: 1
fieldset/OR:
  description: Option register
  fields:
  - name: OP0
    description: Option bit 0 (INP0/INN1 GPIO switch control on ADC1, VDDCORE channel enable on ADC2)
    bit_offset: 0
    bit_size: 1
  - name: OP1
    description: Option bit 1
    bit_offset: 1
    bit_size: 1
fieldset/SMPR:
  description: Sample time register
  fields:
  - name: SMP
    description: Channel x sampling time selection
    bit_offset: 0
    bit_size: 3
    array:
      len: 10
      stride: 3
    enum: SAMPLE_TIME
  - name: SMPPLUS
    description: Addition of one clock cycle to the sampling time (SMPR[0] only)
    bit_offset: 31
    bit_size: 1
    enum: SMPPLUS
fieldset/SQR1:
  description: Regular sequence register 1
  fields:
  - name: L
    description: Regular channel sequence length
    bit_offset: 0
    bit_size: 4
  - name: SQ
    description: Conversion in regular sequence
    bit_offset: 6
    bit_size: 5
    array:
      len: 4
      stride: 6
fieldset/SQR2:
  description: Regular sequence register 2
  fields:
  - name: SQ
    description: Conversion in regular sequence
    bit_offset: 0
    bit_size: 5
    array:
      len: 5
      stride: 6
fieldset/SQR3:
  description: Regular sequence register 3
  fields:
  - name: SQ
    description: Conversion in regular sequence
    bit_offset: 0
    bit_size: 5
    array:
      len: 5
      stride: 6
fieldset/SQR4:
  description: Regular sequence register 4
  fields:
  - name: SQ
    description: Conversion in regular sequence
    bit_offset: 0
    bit_size: 5
    array:
      len: 2
      stride: 6
fieldset/TR:
  description: Analog watchdog threshold register
  fields:
  - name: LT
    description: Analog watchdog lower threshold
    bit_offset: 0
    bit_size: 12
  - name: AWDFILT
    description: Analog watchdog filtering parameter (TR[0] only)
    bit_offset: 12
    bit_size: 3
  - name: HT
    description: Analog watchdog higher threshold
    bit_offset: 16
    bit_size: 12
enum/ALIGN:
  bit_size: 1
  variants:
  - name: Right
    description: Right alignment
    value: 0
  - name: Left
    description: Left alignment
    value: 1
enum/DMACFG:
  bit_size: 1
  variants:
  - name: OneShot
    description: DMA one shot mode selected
    value: 0
  - name: Circular
    description: DMA circular mode selected
    value: 1
enum/EXTEN:
  bit_size: 2
  variants:
  - name: Disabled
    description: Hardware trigger detection disabled (conversions can be launched by software)
    value: 0
  - name: RisingEdge
    description: Hardware trigger detection on the rising edge
    value: 1
  - name: FallingEdge
    description: Hardware trigger detection on the falling edge
    value: 2
  - name: BothEdges
    description: Hardware trigger detection on both the rising and falling edges
    value: 3
enum/OVSR:
  bit_size: 3
  variants:
  - name: Mul2
    description: 2x oversampling ratio
    value: 0
  - name: Mul4
    description: 4x oversampling ratio
    value: 1
  - name: Mul8
    description: 8x oversampling ratio
    value: 2
  - name: Mul16
    description: 16x oversampling ratio
    value: 3
  - name: Mul32
    description: 32x oversampling ratio
    value: 4
  - name: Mul64
    description: 64x oversampling ratio
    value: 5
  - name: Mul128
    description: 128x oversampling ratio
    value: 6
  - name: Mul256
    description: 256x oversampling ratio
    value: 7
enum/RES:
  bit_size: 2
  variants:
  - name: Bits12
    description: 12-bit
    value: 0
  - name: Bits10
    description: 10-bit
    value: 1
  - name: Bits8
    description: 8-bit
    value: 2
  - name: Bits6
    description: 6-bit
    value: 3
enum/ROVSM:
  bit_size: 1
  variants:
  - name: Continued
    description: Oversampling is temporarily stopped and continued after the injection sequence (intermediate results are kept)
    value: 0
  - name: Resumed
    description: Oversampling is aborted and resumed from start after the injection sequence (intermediate results are discarded)
    value: 1
enum/SAMPLE_TIME:
  bit_size: 3
  variants:
  - name: Cycles2_5
    description: 2.5 ADC clock cycles
    value: 0
  - name: Cycles6_5
    description: 6.5 ADC clock cycles
    value: 1
  - name: Cycles12_5
    description: 12.5 ADC clock cycles
    value: 2
  - name: Cycles24_5
    description: 24.5 ADC clock cycles
    value: 3
  - name: Cycles47_5
    description: 47.5 ADC clock cycles
    value: 4
  - name: Cycles92_5
    description: 92.5 ADC clock cycles
    value: 5
  - name: Cycles247_5
    description: 247.5 ADC clock cycles
    value: 6
  - name: Cycles640_5
    description: 640.5 ADC clock cycles
    value: 7
enum/SMPPLUS:
  bit_size: 1
  variants:
  - name: Cycles2_5
    description: SMP = 000 selects 2.5 ADC clock cycles
    value: 0
  - name: Cycles3_5
    description: SMP = 000 selects 3.5 ADC clock cycles
    value: 1
enum/SWTRIG:
  bit_size: 1
  variants:
  - name: Conversion
    description: Software trigger starts the conversion
    value: 0
  - name: Sampling
    description: Software trigger starts the sampling phase (the conversion starts when the trigger is cleared)
    value: 1
enum/TROVS:
  bit_size: 1
  variants:
  - name: Automatic
    description: All oversampled conversions for a channel are done consecutively after a trigger
    value: 0
  - name: Triggered
    description: Each oversampled conversion for a channel needs a trigger
    value: 1
