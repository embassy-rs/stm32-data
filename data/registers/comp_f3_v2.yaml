block/COMP:
  description: General purpose comparators.
  items:
  - name: CSR
    description: control and status register.
    byte_offset: 0
    fieldset: CSR
fieldset/CSR:
  description: control and status register.
  fields:
  - name: EN
    description: Comparator enable.
    bit_offset: 0
    bit_size: 1
  - name: INP_DAC
    description: Comparator non-inverting input connection to DAC output.
    bit_offset: 1
    bit_size: 1
  - name: MODE
    description: Comparator mode (encoding differs between COMP1/2 and COMP3..7; see reference manual).
    bit_offset: 2
    bit_size: 2
  - name: INMSEL
    description: Comparator inverting input selection.
    bit_offset:
    - start: 4
      end: 6
    - start: 22
      end: 22
    bit_size: 4
  - name: INPSEL
    description: Comparator non-inverting input selection.
    bit_offset: 7
    bit_size: 1
  - name: WINMODE
    description: Window mode enable (available on even comparators).
    bit_offset: 9
    bit_size: 1
  - name: OUTSEL
    description: Comparator output selection.
    bit_offset: 10
    bit_size: 4
  - name: POL
    description: Comparator output polarity.
    bit_offset: 15
    bit_size: 1
  - name: HYST
    description: Comparator hysteresis.
    bit_offset: 16
    bit_size: 2
    enum: HYST
  - name: BLANKING
    description: Comparator blanking source.
    bit_offset: 18
    bit_size: 3
  - name: OUT
    description: Comparator output.
    bit_offset: 30
    bit_size: 1
  - name: LOCK
    description: Comparator lock.
    bit_offset: 31
    bit_size: 1
enum/HYST:
  bit_size: 2
  variants:
  - name: None
    value: 0
  - name: Low
    description: Low hysteresis
    value: 1
  - name: Medium
    description: Medium hysteresis
    value: 2
  - name: High
    description: High hysteresis
    value: 3
