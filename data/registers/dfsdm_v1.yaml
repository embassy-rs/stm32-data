# TOP LEVEL BLOCKS
      
# RM0432 (STM32L412/L422 newer): Upgraded sized-down core hosting 2
# transceiver channels, 1 filter channel, 5-bit trigger, parallel
# ADC routing, and active channel delay tuning registers (DLY)
# exposing Pulse Skip (PLSSKP[5:0]) at offset 0x14.
block/DFSDM_2CH_1FLT_DLY_TRG5_ADC:
  description: Digital filter for sigma delta modulators.
  items:
    - name: CH
      description: Cluster CH%s, containing CH?CFGR1, CH?CFGR2, CH?AWSCDR, CH?WDATR, CH?DATINR, CH?DLYR.
      array:
        len: 2
        stride: 0x20
      byte_offset: 0x00
      block: CH_DLY
    - name: FLT
      description: Cluster FLT%s, containing FLT?CR1, FLT?CR2, FLT?ISR, FLT?ICR, FLT?JCHGR, FLT?FCR, FLT?JDATAR, FLT?RDATAR, FLT?AWHTR, FLT?AWLTR, FLT?AWSR, FLT?AWCFR, FLT?EXMAX, FLT?EXMIN, FLT?CNVTIMR.
      array:
        len: 1
        stride: 0x80
      byte_offset: 0x100
      block: FLT

block/DFSDM_2CH_1FLT_TRG5:
  description: Digital filter for sigma delta modulators.
  items:
    - name: CH
      description: Cluster CH%s, containing CH?CFGR1, CH?CFGR2, CH?AWSCDR, CH?WDATR, CH?DATINR, CH?DLYR.
      array:
        len: 2
        stride: 0x20
      byte_offset: 0x00
      block: CH
    - name: FLT
      description: Cluster FLT%s, containing FLT?CR1, FLT?CR2, FLT?ISR, FLT?ICR, FLT?JCHGR, FLT?FCR, FLT?JDATAR, FLT?RDATAR, FLT?AWHTR, FLT?AWLTR, FLT?AWSR, FLT?AWCFR, FLT?EXMAX, FLT?EXMIN, FLT?CNVTIMR.
      array:
        len: 1
        stride: 0x80
      byte_offset: 0x100
      block: FLT

