  - pattern: "STM32F1.0.E"
    variants:
      - - {name: BANK_1, address: 0x08000000, size_kb: 512}
        - {name: SRAM, address: 0x20000000, size_kb: 32}
  - pattern: "STM32F1.1.C"
    variants:
