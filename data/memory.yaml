# Chip memory geometry used by stm32-data-gen.
#
# mems: memory regions per chip pattern, one `variants` list per memory
#   configuration (most chips have exactly one variant). Regions use
#   size_kb (kibibytes) or size_bytes, and an optional access ("rwx").
# flash_info: flash geometry per chip pattern; `erase_size` is a list of
#   [sector size in bytes, sector count] pairs, biggest sector type last.
#
# Entries are matched in order: the first pattern matching the chip name
# wins (this is why this file is a list, not a map).
mems:
  # C0
  - pattern: "STM32C01..4"
    variants:
      - - {name: BANK_1, address: 0x08000000, size_kb: 16}
        - {name: SRAM, address: 0x20000000, size_kb: 6}
  - pattern: "STM32C01..6"
    variants:
      - - {name: BANK_1, address: 0x08000000, size_kb: 32}
        - {name: SRAM, address: 0x20000000, size_kb: 6}
  - pattern: "STM32C03..4"
    variants:
      - - {name: BANK_1, address: 0x08000000, size_kb: 16}
        - {name: SRAM, address: 0x20000000, size_kb: 12}
  - pattern: "STM32C03..6"
    variants:
      - - {name: BANK_1, address: 0x08000000, size_kb: 32}
        - {name: SRAM, address: 0x20000000, size_kb: 12}
  - pattern: "STM32C05..6"
    variants:
      - - {name: BANK_1, address: 0x08000000, size_kb: 32}
        - {name: SRAM, address: 0x20000000, size_kb: 12}
  - pattern: "STM32C05..8"
    variants:
      - - {name: BANK_1, address: 0x08000000, size_kb: 64}
        - {name: SRAM, address: 0x20000000, size_kb: 12}
  - pattern: "STM32C07..8"
    variants:
      - - {name: BANK_1, address: 0x08000000, size_kb: 64}
        - {name: SRAM, address: 0x20000000, size_kb: 24}
  - pattern: "STM32C07..B"
    variants:
      - - {name: BANK_1, address: 0x08000000, size_kb: 128}
        - {name: SRAM, address: 0x20000000, size_kb: 24}
  - pattern: "STM32C091.B"
    variants:
      - - {name: BANK_1, address: 0x08000000, size_kb: 128}
        - {name: SRAM, address: 0x20000000, size_kb: 36}
  - pattern: "STM32C091.C"
    variants:
      - - {name: BANK_1, address: 0x08000000, size_kb: 256}
        - {name: SRAM, address: 0x20000000, size_kb: 36}
  - pattern: "STM32C092.B"
    variants:
      - - {name: BANK_1, address: 0x08000000, size_kb: 128}
        - {name: SRAM, address: 0x20000000, size_kb: 30}
  - pattern: "STM32C092.C"
    variants:
      - - {name: BANK_1, address: 0x08000000, size_kb: 256}
        - {name: SRAM, address: 0x20000000, size_kb: 30}
  # C5
  - pattern: "STM32C53..B"
    variants:
      - - {name: BANK_1, address: 0x08000000, size_kb: 128}
        - {name: SRAM1, address: 0x20000000, size_kb: 32}
        - {name: SRAM2, address: 0x20008000, size_kb: 32}
      - - {name: BANK_1, address: 0x08000000, size_kb: 64}
        - {name: BANK_2, address: 0x08010000, size_kb: 64}
        - {name: SRAM1, address: 0x20000000, size_kb: 32}
        - {name: SRAM2, address: 0x20008000, size_kb: 32}
  - pattern: "STM32C53..C"
    variants:
      - - {name: BANK_1, address: 0x08000000, size_kb: 128}
        - {name: BANK_2, address: 0x08020000, size_kb: 128}
        - {name: SRAM1, address: 0x20000000, size_kb: 32}
        - {name: SRAM2, address: 0x20008000, size_kb: 32}
  - pattern: "STM32C542.C"
    variants:
      - - {name: BANK_1, address: 0x08000000, size_kb: 128}
        - {name: BANK_2, address: 0x08020000, size_kb: 128}
        - {name: SRAM1, address: 0x20000000, size_kb: 32}
        - {name: SRAM2, address: 0x20008000, size_kb: 32}
  - pattern: "STM32C55..C"
    variants:
      - - {name: BANK_1, address: 0x08000000, size_kb: 256}
        - {name: SRAM1, address: 0x20000000, size_kb: 64}
        - {name: SRAM2, address: 0x20010000, size_kb: 64}
      - - {name: BANK_1, address: 0x08000000, size_kb: 128}
        - {name: BANK_2, address: 0x08020000, size_kb: 128}
        - {name: SRAM1, address: 0x20000000, size_kb: 64}
        - {name: SRAM2, address: 0x20010000, size_kb: 64}
  - pattern: "STM32C55..E"
    variants:
      - - {name: BANK_1, address: 0x08000000, size_kb: 256}
        - {name: BANK_2, address: 0x08040000, size_kb: 256}
        - {name: SRAM1, address: 0x20000000, size_kb: 64}
        - {name: SRAM2, address: 0x20010000, size_kb: 64}
  - pattern: "STM32C562.E"
    variants:
      - - {name: BANK_1, address: 0x08000000, size_kb: 256}
        - {name: BANK_2, address: 0x08040000, size_kb: 256}
        - {name: SRAM1, address: 0x20000000, size_kb: 64}
        - {name: SRAM2, address: 0x20010000, size_kb: 64}
  - pattern: "STM32C59..E"
    variants:
      - - {name: BANK_1, address: 0x08000000, size_kb: 512}
        - {name: SRAM1, address: 0x20000000, size_kb: 128}
        - {name: SRAM2, address: 0x20020000, size_kb: 128}
      - - {name: BANK_1, address: 0x08000000, size_kb: 256}
        - {name: BANK_2, address: 0x08040000, size_kb: 256}
        - {name: SRAM1, address: 0x20000000, size_kb: 128}
        - {name: SRAM2, address: 0x20020000, size_kb: 128}
  - pattern: "STM32C59..G"
    variants:
      - - {name: BANK_1, address: 0x08000000, size_kb: 512}
        - {name: BANK_2, address: 0x08080000, size_kb: 512}
        - {name: SRAM1, address: 0x20000000, size_kb: 128}
        - {name: SRAM2, address: 0x20020000, size_kb: 128}
  - pattern: "STM32C5A3.G"
    variants:
      - - {name: BANK_1, address: 0x08000000, size_kb: 512}
        - {name: BANK_2, address: 0x08080000, size_kb: 512}
        - {name: SRAM1, address: 0x20000000, size_kb: 128}
        - {name: SRAM2, address: 0x20020000, size_kb: 128}
  - pattern: "STM32MP1...[A]"
    variants:
      - - {name: SRAM, address: 0x10000000, size_kb: 256}
  # F0
  - pattern: "STM32F0...C"
    variants:
      - - {name: BANK_1, address: 0x08000000, size_kb: 256}
        - {name: SRAM, address: 0x20000000, size_kb: 32}
  - pattern: "STM32F0[35]..8"
    variants:
      - - {name: BANK_1, address: 0x08000000, size_kb: 64}
        - {name: SRAM, address: 0x20000000, size_kb: 8}
  - pattern: "STM32F0[47]..6"
    variants:
      - - {name: BANK_1, address: 0x08000000, size_kb: 32}
        - {name: SRAM, address: 0x20000000, size_kb: 6}
  - pattern: "STM32F03..4"
    variants:
      - - {name: BANK_1, address: 0x08000000, size_kb: 16}
        - {name: SRAM, address: 0x20000000, size_kb: 4}
  - pattern: "STM32F03..6"
    variants:
      - - {name: BANK_1, address: 0x08000000, size_kb: 32}
        - {name: SRAM, address: 0x20000000, size_kb: 4}
  - pattern: "STM32F04..4"
    variants:
      - - {name: BANK_1, address: 0x08000000, size_kb: 16}
        - {name: SRAM, address: 0x20000000, size_kb: 6}
  - pattern: "STM32F05..4"
    variants:
      - - {name: BANK_1, address: 0x08000000, size_kb: 16}
        - {name: SRAM, address: 0x20000000, size_kb: 8}
  - pattern: "STM32F05..6"
    variants:
      - - {name: BANK_1, address: 0x08000000, size_kb: 32}
        - {name: SRAM, address: 0x20000000, size_kb: 8}
  - pattern: "STM32F07..8"
    variants:
      - - {name: BANK_1, address: 0x08000000, size_kb: 64}
        - {name: SRAM, address: 0x20000000, size_kb: 16}
  - pattern: "STM32F07..B"
    variants:
      - - {name: BANK_1, address: 0x08000000, size_kb: 128}
        - {name: SRAM, address: 0x20000000, size_kb: 16}
  - pattern: "STM32F09..B"
    variants:
      - - {name: BANK_1, address: 0x08000000, size_kb: 128}
        - {name: SRAM, address: 0x20000000, size_kb: 32}
  # F1
  - pattern: "STM32F1.[12].6"
    variants:
      - - {name: BANK_1, address: 0x08000000, size_kb: 32}
        - {name: SRAM, address: 0x20000000, size_kb: 6}
  - pattern: "STM32F1.[12].8"
    variants:
      - - {name: BANK_1, address: 0x08000000, size_kb: 64}
        - {name: SRAM, address: 0x20000000, size_kb: 10}
  - pattern: "STM32F1.[12].B"
    variants:
      - - {name: BANK_1, address: 0x08000000, size_kb: 128}
        - {name: SRAM, address: 0x20000000, size_kb: 16}
  - pattern: "STM32F1.[57].B"
    variants:
      - - {name: BANK_1, address: 0x08000000, size_kb: 128}
        - {name: SRAM, address: 0x20000000, size_kb: 64}
  - pattern: "STM32F1.[57].C"
