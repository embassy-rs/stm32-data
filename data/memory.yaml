  - pattern: "STM32F1.1.F"
    variants:
      - - {name: BANK_1, address: 0x08000000, size_kb: 512}
        - {name: BANK_2, address: 0x08080000, size_kb: 256}
        - {name: SRAM, address: 0x20000000, size_kb: 80}
  - pattern: "STM32F1.1.G"
    variants:
      - - {name: BANK_1, address: 0x08000000, size_kb: 512}
        - {name: BANK_2, address: 0x08080000, size_kb: 512}
        - {name: SRAM, address: 0x20000000, size_kb: 80}
  - pattern: "STM32F1.3.6"
    variants:
      - - {name: BANK_1, address: 0x08000000, size_kb: 32}
        - {name: SRAM, address: 0x20000000, size_kb: 10}
  - pattern: "STM32F1.3.8"
    variants:
      - - {name: BANK_1, address: 0x08000000, size_kb: 64}
        - {name: SRAM, address: 0x20000000, size_kb: 20}
  - pattern: "STM32F1.3.B"
    variants:
      - - {name: BANK_1, address: 0x08000000, size_kb: 128}
        - {name: SRAM, address: 0x20000000, size_kb: 20}
  - pattern: "STM32F1.3.C"
    variants:
      - - {name: BANK_1, address: 0x08000000, size_kb: 256}
        - {name: SRAM, address: 0x20000000, size_kb: 48}
  - pattern: "STM32F1.3.D"
    variants:
      - - {name: BANK_1, address: 0x08000000, size_kb: 384}
        - {name: SRAM, address: 0x20000000, size_kb: 64}
  - pattern: "STM32F1.3.E"
    variants:
      - - {name: BANK_1, address: 0x08000000, size_kb: 512}
        - {name: SRAM, address: 0x20000000, size_kb: 64}
  - pattern: "STM32F1.3.F"
    variants:
