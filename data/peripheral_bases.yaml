# Peripheral base-address define aliases.
#
# Maps a peripheral name to the C header `#define`s that may hold that
# peripheral's register-block base address, in priority order. The first define
# that is present and non-zero wins. Peripherals not listed here are looked up
# as `{NAME}_BASE` and then `NAME`.

DBGMCU:
  - DBGMCU_BASE
  - DBG_BASE
QUADSPI:
  - QUADSPI_R_BASE
  - QUADSPI_BASE
  - QSPI_R
  - QSPI_R_BASE
  - QSPI_REG_BASE
