# Derived from CMSIS-SVD enumerated values (see provenance per rule).
# Source: sources/svd/<file>.svd, extracted by `trigger-svd-extract`.
# Regenerate: re-run the extractor and this script after updating SVDs.
# SVD: stm32f{100,101,102,103,107}.svd, peripherals ADC1/ADC2, fields EXTSEL/JEXTSEL.
# All five F1 SVDs agree. EXTSEL[6]/JEXTSEL[6] carry both EXTI1x_TRG and
# TIM8_* : TIM8 exists only on high-/XL-density F101/103 (CDEFG flash codes).

- match: '^STM32F10[13].[CDEFG]:ADC(1|2)'
  triggers:
    - signal: ADC_EXT_TRG0
      source: TIM1_CH1
    - signal: ADC_EXT_TRG1
      source: TIM1_CH2
    - signal: ADC_EXT_TRG2
      source: TIM1_CH3
    - signal: ADC_EXT_TRG3
      source: TIM2_CH2
    - signal: ADC_EXT_TRG4
      source: TIM3_TRGO
    - signal: ADC_EXT_TRG5
      source: TIM4_CH4
    - signal: ADC_EXT_TRG6
      source: EXTI11_TRG
    - signal: ADC_EXT_TRG6
      source: TIM8_TRGO
    - signal: ADC_JEXT_TRG0
      source: TIM1_TRGO
    - signal: ADC_JEXT_TRG1
      source: TIM1_CH4
    - signal: ADC_JEXT_TRG2
      source: TIM2_TRGO
    - signal: ADC_JEXT_TRG3
      source: TIM2_CH1
    - signal: ADC_JEXT_TRG4
      source: TIM3_CH4
    - signal: ADC_JEXT_TRG5
      source: TIM4_TRGO
    - signal: ADC_JEXT_TRG6
      source: EXTI15_TRG
    - signal: ADC_JEXT_TRG6
      source: TIM8_CH4
