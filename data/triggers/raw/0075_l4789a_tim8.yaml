# Rule 75 of the original hand-maintained PERIPHERAL_TRIGGER_RULES table
# (stm32-data-gen/src/trigger.rs @ HEAD before the data-driven rewrite).
# Provenance: hand-written from the family reference manual.
# VERIFIED 2026 against RM0351 Table 159 "DFSDM break connection":
# break2 -> TIM8 break, break3 -> TIM8 break2 — matches.
# match: ^STM32L4(7|8|9|A).*:TIM8.*

- match: '^STM32L4(7|8|9|A).*:TIM8.*'
  triggers:
    - signal: TIMX_BRK_IN1
      source: DFSDM1_BREAK2
    - signal: TIMX_BRK_IN2
      source: DFSDM1_BREAK3
