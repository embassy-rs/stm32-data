# DAC channel trigger inputs, STM32H7 catch-all (H742/743/745/747/750/753/755/757).
# Verified against RM0433 (H742/743/753/750) Table 227 "DAC interconnection" and
# RM0399 (H745/755/747/757) Table 231 "DAC interconnection" — identical 13-entry
# tables; content unchanged from the original hand rules. exti9 maps to
# EXTI9_TRG, lptim{n}_out to LPTIM{n}_TRGO, hrtim1_dactrg{n} to HRTIM_DAC_TRG{n}
# per CONVENTIONS.md.
# match: ^STM32H7.*:DAC.*

- match: '^STM32H7.*:DAC.*'
  triggers:
    - signal: DAC_CHX_TRG1
      source: TIM1_TRGO
    - signal: DAC_CHX_TRG2
      source: TIM2_TRGO
    - signal: DAC_CHX_TRG3
      source: TIM4_TRGO
    - signal: DAC_CHX_TRG4
      source: TIM5_TRGO
    - signal: DAC_CHX_TRG5
      source: TIM6_TRGO
    - signal: DAC_CHX_TRG6
      source: TIM7_TRGO
    - signal: DAC_CHX_TRG7
      source: TIM8_TRGO
    - signal: DAC_CHX_TRG8
      source: TIM15_TRGO
    - signal: DAC_CHX_TRG9
      source: HRTIM_DAC_TRG1
    - signal: DAC_CHX_TRG10
      source: HRTIM_DAC_TRG2
    - signal: DAC_CHX_TRG11
      source: LPTIM1_TRGO
    - signal: DAC_CHX_TRG12
      source: LPTIM2_TRGO
    - signal: DAC_CHX_TRG13
      source: EXTI9_TRG
