# VERIFIED: RM0351 (STM32L47x/48x/49x/4Ax) Table 108 "ADC1, ADC2 and ADC3 -
# External triggers for regular channels" (EXTSEL[3:0]) and Table 109 "... for
# injected channels" (JEXTSEL[3:0]). Cross-checked against the L471-486
# stm32l4xx_ll_adc.h trigger defines in tmp/l4work/ll_adc.h — exact match.
# Cross-checked against the stm32l4p5 SVD (identical indices for the rows it
# enumerates; SVD omits TIM4/TIM8 rows, see top-of-file note).
- match: '^STM32L4(7|8|9|A).*:ADC(\d+)?'
  triggers:
    - signal: ADC_EXT_TRG0
      source: TIM1_CC1
    - signal: ADC_EXT_TRG1
      source: TIM1_CC2
    - signal: ADC_EXT_TRG2
      source: TIM1_CC3
    - signal: ADC_EXT_TRG3
      source: TIM2_CC2
    - signal: ADC_EXT_TRG4
      source: TIM3_TRGO
    - signal: ADC_EXT_TRG5
      source: TIM4_CC4
    - signal: ADC_EXT_TRG6
      source: EXTI11_TRG
    - signal: ADC_EXT_TRG7
      source: TIM8_TRGO
    - signal: ADC_EXT_TRG8
      source: TIM8_TRGO2
    - signal: ADC_EXT_TRG9
      source: TIM1_TRGO
    - signal: ADC_EXT_TRG10
      source: TIM1_TRGO2
    - signal: ADC_EXT_TRG11
      source: TIM2_TRGO
    - signal: ADC_EXT_TRG12
      source: TIM4_TRGO
    - signal: ADC_EXT_TRG13
      source: TIM6_TRGO
    - signal: ADC_EXT_TRG14
      source: TIM15_TRGO
    - signal: ADC_EXT_TRG15
      source: TIM3_CC4
    - signal: ADC_JEXT_TRG0
      source: TIM1_TRGO
    - signal: ADC_JEXT_TRG1
      source: TIM1_CC4
    - signal: ADC_JEXT_TRG2
      source: TIM2_TRGO
    - signal: ADC_JEXT_TRG3
      source: TIM2_CC1
    - signal: ADC_JEXT_TRG4
      source: TIM3_CC4
    - signal: ADC_JEXT_TRG5
      source: TIM4_TRGO
    - signal: ADC_JEXT_TRG6
      source: EXTI15_TRG
    - signal: ADC_JEXT_TRG7
      source: TIM8_CC4
    - signal: ADC_JEXT_TRG8
      source: TIM1_TRGO2
    - signal: ADC_JEXT_TRG9
      source: TIM8_TRGO
    - signal: ADC_JEXT_TRG10
      source: TIM8_TRGO2
    - signal: ADC_JEXT_TRG11
      source: TIM3_CC3
    - signal: ADC_JEXT_TRG12
      source: TIM3_TRGO
    - signal: ADC_JEXT_TRG13
      source: TIM3_CC1
    - signal: ADC_JEXT_TRG14
      source: TIM6_TRGO
    - signal: ADC_JEXT_TRG15
      source: TIM15_TRGO

# UNVERIFIED against RM (truncated): RM0394 ADC external-trigger tables are
# not on disk. Content follows the L4 family table — tmp/l4work/stm32l4xx_ll_adc.h
