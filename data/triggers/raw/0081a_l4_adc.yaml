# UNVERIFIED against RM (truncated): RM0432 Tables 131/132 ("ADC1 - External
# triggers for regular/injected channels") are not on disk. Source set per
# RM0432 00-index §10.3.2 (TIM1/TIM2/TIM3/TIM4/TIM6/TIM8/TIM15 + EXTI) is
# identical to RM0351's, and the L4+ ADC keeps the same 4-bit EXTSEL/JEXTSEL
# fields (CMSIS headers stm32l4p5xx.h/stm32l4r5xx.h), so the RM0351 indices
# are used. The stm32l4p5 SVD's omission of the TIM4/TIM8 rows is the known
# SVD deficiency (G4's SVD has the same gap; RM0440's tables include them —
# see raw rule 0042). L4+ has a single ADC (ADC1).
- match: '^STM32L4(P|Q|R|S).*:ADC(\d+)?'
  triggers:
    - signal: ADC_EXT_TRG0
      source: TIM1_CC1
