# STM32U5 LPDMA1 hardware trigger inputs (CxTR2.TRIGSEL).
# RM0456 Rev 7, Table 150 "Programmed LPDMA1 trigger".
#
# COMP2_OUT is trimmed per chip by the generator on U535/U545 (no COMP2).
# Names as in 0133_u5_gpdma1.yaml.

- match: '^STM32U5.*:LPDMA1'
  triggers:
    - signal: LPDMA_TRG0
      source: EXTI0_TRG
    - signal: LPDMA_TRG1
      source: EXTI1_TRG
    - signal: LPDMA_TRG2
      source: EXTI2_TRG
    - signal: LPDMA_TRG3
      source: EXTI3_TRG
    - signal: LPDMA_TRG4
      source: EXTI4_TRG
    - signal: LPDMA_TRG5
      source: TAMP_TRG1
    - signal: LPDMA_TRG6
      source: TAMP_TRG2
    - signal: LPDMA_TRG7
      source: TAMP_TRG3
    - signal: LPDMA_TRG8
      source: LPTIM1_CH1
    - signal: LPDMA_TRG9
      source: LPTIM1_CH2
    - signal: LPDMA_TRG10
      source: LPTIM3_CH1
    - signal: LPDMA_TRG11
      source: LPTIM4_OUT
    - signal: LPDMA_TRG12
      source: COMP1_OUT
    - signal: LPDMA_TRG13
      source: COMP2_OUT
    - signal: LPDMA_TRG14
      source: RTC_ALRA_TRG
    - signal: LPDMA_TRG15
      source: RTC_ALRB_TRG
    - signal: LPDMA_TRG16
      source: RTC_WUT_TRG
    - signal: LPDMA_TRG17
      source: ADC4_AWD1
    - signal: LPDMA_TRG18
      source: LPDMA_CH0_TC
    - signal: LPDMA_TRG19
      source: LPDMA_CH1_TC
    - signal: LPDMA_TRG20
      source: LPDMA_CH2_TC
    - signal: LPDMA_TRG21
      source: LPDMA_CH3_TC
    - signal: LPDMA_TRG22
      source: GPDMA_CH0_TC
    - signal: LPDMA_TRG23
      source: GPDMA_CH1_TC
    - signal: LPDMA_TRG24
      source: GPDMA_CH4_TC
    - signal: LPDMA_TRG25
      source: GPDMA_CH5_TC
    - signal: LPDMA_TRG26
      source: GPDMA_CH6_TC
    - signal: LPDMA_TRG27
      source: GPDMA_CH7_TC
    - signal: LPDMA_TRG28
      source: GPDMA_CH12_TC
    - signal: LPDMA_TRG29
      source: GPDMA_CH13_TC
    - signal: LPDMA_TRG30
      source: TIM2_TRGO
    - signal: LPDMA_TRG31
      source: TIM15_TRGO
