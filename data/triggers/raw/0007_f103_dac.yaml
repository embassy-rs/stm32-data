# Derived from CMSIS-SVD enumerated values (see provenance per rule).
# Source: sources/svd/<file>.svd, extracted by `trigger-svd-extract`.
# Regenerate: re-run the extractor and this script after updating SVDs.
# SVD: stm32f103.svd, field DAC_CR.TSEL2 (channel 2 table; identical to the
# historical hand rule).

- match: '^STM32F103.*:DAC.*'
  triggers:
    - signal: DAC_CHX_TRG0
      source: TIM6_TRGO
    - signal: DAC_CHX_TRG1
      source: TIM8_TRGO
    - signal: DAC_CHX_TRG2
      source: TIM7_TRGO
    - signal: DAC_CHX_TRG3
      source: TIM5_TRGO
    - signal: DAC_CHX_TRG4
      source: TIM2_TRGO
    - signal: DAC_CHX_TRG5
      source: TIM4_TRGO
    - signal: DAC_CHX_TRG6
      source: EXTI9_TRG
