# Derived from CMSIS-SVD enumerated values (see provenance per rule).
# Source: sources/svd/<file>.svd, extracted by `trigger-svd-extract`.
# Regenerate: re-run the extractor and this script after updating SVDs.
# SVD: stm32f{101,102,103,107}.svd, peripheral ADC3, fields EXTSEL/JEXTSEL.

- match: '^STM32F10[13].[CDEFG]:ADC3'
  triggers:
    - signal: ADC_EXT_TRG0
      source: TIM3_CH1
    - signal: ADC_EXT_TRG1
      source: TIM2_CH3
    - signal: ADC_EXT_TRG2
      source: TIM1_CH3
    - signal: ADC_EXT_TRG3
      source: TIM8_CH1
    - signal: ADC_EXT_TRG4
      source: TIM8_TRGO
    - signal: ADC_EXT_TRG5
      source: TIM5_CH1
    - signal: ADC_EXT_TRG6
      source: TIM5_CH3
    - signal: ADC_JEXT_TRG0
      source: TIM1_TRGO
    - signal: ADC_JEXT_TRG1
      source: TIM1_CH4
    - signal: ADC_JEXT_TRG2
      source: TIM4_CH3
    - signal: ADC_JEXT_TRG3
      source: TIM8_CH2
    - signal: ADC_JEXT_TRG4
      source: TIM8_CH4
    - signal: ADC_JEXT_TRG5
      source: TIM5_TRGO
    - signal: ADC_JEXT_TRG6
      source: TIM5_CH4
