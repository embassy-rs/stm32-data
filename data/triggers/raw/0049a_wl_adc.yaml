# Derived from the reference manual (provenance below).
- match: '^STM32WL.*:ADC.*'
  triggers:
    - signal: ADC_EXT_TRG0
      source: TIM1_TRGO2
    - signal: ADC_EXT_TRG1
      source: TIM1_CC4
    - signal: ADC_EXT_TRG2
      source: TIM2_TRGO
    - signal: ADC_EXT_TRG3
      source: TIM2_CC4
    - signal: ADC_EXT_TRG5
      source: TIM2_CC3
    - signal: ADC_EXT_TRG7
      source: EXTI11_TRG