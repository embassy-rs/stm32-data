# DFSDM1 watchdog-break inputs of STM32H7A3/7B3/7B0 TIM15.
# NOT covered by any RM in tmp/rm (RM0433/RM0399 cover H743 and H745 only) —
# content kept from the original hand rules (break[0] -> TIM1 break / TIM15 break).
# match: ^STM32H7(A3|B3|B0).*:TIM15.*

- match: '^STM32H7(A3|B3|B0).*:TIM15.*'
  triggers:
    - signal: TIMX_BRK_IN1
      source: DFSDM1_BREAK0
