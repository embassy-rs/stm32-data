# Extracted from RM0313 (STM32F37), DAC chapter 14.5.4,
# Table 40 "External triggers (DAC1)".
# Corrects the original hand rule: EXTI9 is TSEL=110 (was wrongly 5);
# TIM4_TRGO@TSEL=101 was missing. TIM5 exists on F373/F378 (TRG3).
# DAC1 and DAC2 tables are identical except index 3/5 (see 0019).

- match: '^STM32F37(3|8).*:DAC1'
  triggers:
    - signal: DAC_CHX_TRG0
      source: TIM6_TRGO
    - signal: DAC_CHX_TRG1
      source: TIM3_TRGO
    - signal: DAC_CHX_TRG2
      source: TIM7_TRGO
    - signal: DAC_CHX_TRG3
      source: TIM5_TRGO
    - signal: DAC_CHX_TRG4
      source: TIM2_TRGO
    - signal: DAC_CHX_TRG5
      source: TIM4_TRGO
    - signal: DAC_CHX_TRG6
      source: EXTI9_TRG
