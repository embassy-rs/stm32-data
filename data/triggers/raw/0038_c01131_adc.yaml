# Extracted from RM0490 (STM32C0), ADC chapter 16, Table 68
# "External triggers" (EXTSEL[2:0]).
# Footnotes: TIM2_TRGO available on C051/71/91/92 only (absent on
# C011/31); TIM15_TRGO on C091/92 only. TRG2/TRG5/TRG6 unbonded here.
# EXTI11 is written "EXTI11" in the RM; normalized to EXTI11_TRG.

- match: '^STM32C0(11|31).*:ADC.*'
  triggers:
    - signal: ADC_EXT_TRG0
      source: TIM1_TRGO2
    - signal: ADC_EXT_TRG1
      source: TIM1_CC4
    - signal: ADC_EXT_TRG3
      source: TIM3_TRGO
    - signal: ADC_EXT_TRG7
      source: EXTI11_TRG
