# STM32WBA54/55 SPI3 trigger inputs.
# Provenance: RM0493 (STM32WBA5) ch.41 (SPI), Table 400 "SPI interconnection
# (SPI3)": spi_trg5 = exti8 (not exti9), and trg7 / trg9 are Reserved — SPI3
# has no LPTIM2_CH1 and no COMP2_OUT source; trg12..15 Reserved. Verified
# against the RM; identical to the old hand rule.
# match: ^STM32WBA5[45].*:SPI3

- match: '^STM32WBA5[45].*:SPI3'
  triggers:
    - signal: SPI_TRG0
      source: GPDMA_CH0_TC
    - signal: SPI_TRG1
      source: GPDMA_CH1_TC
    - signal: SPI_TRG2
      source: GPDMA_CH2_TC
    - signal: SPI_TRG3
      source: GPDMA_CH3_TC
    - signal: SPI_TRG4
      source: EXTI4_TRG
    - signal: SPI_TRG5
      source: EXTI8_TRG
    - signal: SPI_TRG6
      source: LPTIM1_CH1
    - signal: SPI_TRG8
      source: COMP1_OUT
    - signal: SPI_TRG10
      source: RTC_ALRA_TRG
    - signal: SPI_TRG11
      source: RTC_WUT_TRG
