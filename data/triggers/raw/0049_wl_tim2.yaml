# TIM2 interconnection inputs for STM32WL (WL5x + WLE5).
# Provenance: RM0461 (STM32WLEx) ch. 24 / RM0453 (STM32WL5x) ch. 26:
# - Table 172 "TIM2 internal trigger connection" (ITR0: TIM1_TRGO)
# - TIM2_OR1 bits 3:2 "TI4_RMP" (01: COMP1_OUT, 10: COMP2_OUT, 11: COMP1_OUT OR COMP2_OUT)
# - TIM2_AF1 bits 17:14 "ETRSEL" (0001: COMP1_OUT, 0010: COMP2_OUT)

- match: '^STM32WL.*:TIM2'
  triggers:
    - signal: TIMX_TI4_IN1
      source: COMP1_OUT
    - signal: TIMX_TI4_IN2
      source: COMP2_OUT
    - signal: TIMX_TI4_IN3
      source: COMP1_OUT_OR_COMP2_OUT
    - signal: TIMX_ITR_IN0
      source: TIM1_TRGO
    - signal: TIMX_ETR_IN1
      source: COMP1_OUT
    - signal: TIMX_ETR_IN2
      source: COMP2_OUT
