# DAC external triggers, STM32L1 (L100/L151/L152/L162; 1-channel 10-bit DAC,
# TSELx is 3 bits wide).
# RM0038 (STM32L100/151/152/162) Table 68 "External triggers" (DAC chapter, 13).
# TSEL=001 Reserved; TSEL=111 is SWTRIG (software, skipped). EXTI line 9 ->
# EXTI9_TRG. TIM9 exists on L1 (RM0038 ch. 18 "TIM9 to TIM11").
# match: ^STM32L1.*:DAC.*

- match: '^STM32L1.*:DAC.*'
  triggers:
    - signal: DAC_CHX_TRG0
      source: TIM6_TRGO
    - signal: DAC_CHX_TRG2
      source: TIM7_TRGO
    - signal: DAC_CHX_TRG3
      source: TIM9_TRGO
    - signal: DAC_CHX_TRG4
      source: TIM2_TRGO
    - signal: DAC_CHX_TRG5
      source: TIM4_TRGO
    - signal: DAC_CHX_TRG6
      source: EXTI9_TRG
