# STM32WBA54/55 USART1/USART2 trigger inputs.
# Provenance: RM0493 (STM32WBA5) ch.39 (USART), Table 377 "USART
# interconnection (USART1/2)": usart_trg0..11 = gpdma1_ch0..3_tc, exti6,
# exti9, lptim1_ch1, lptim2_ch1, comp1_out, comp2_out, rtc_alra_trg,
# rtc_wut_trg; trg12..15 unconnected ("-"). Verified against the RM;
# identical to the old hand rule.
# match: ^STM32WBA5[45].*:USART[12]

- match: '^STM32WBA5[45].*:USART[12]'
  triggers:
    - signal: USART_TRG0
      source: GPDMA_CH0_TC
    - signal: USART_TRG1
      source: GPDMA_CH1_TC
    - signal: USART_TRG2
      source: GPDMA_CH2_TC
    - signal: USART_TRG3
      source: GPDMA_CH3_TC
    - signal: USART_TRG4
      source: EXTI6_TRG
    - signal: USART_TRG5
      source: EXTI9_TRG
    - signal: USART_TRG6
      source: LPTIM1_CH1
    - signal: USART_TRG7
      source: LPTIM2_CH1
    - signal: USART_TRG8
      source: COMP1_OUT
    - signal: USART_TRG9
      source: COMP2_OUT
    - signal: USART_TRG10
      source: RTC_ALRA_TRG
    - signal: USART_TRG11
      source: RTC_WUT_TRG
