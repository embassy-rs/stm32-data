# Rule 74 of the original hand-maintained PERIPHERAL_TRIGGER_RULES table
# (stm32-data-gen/src/trigger.rs @ HEAD before the data-driven rewrite).
# Provenance: hand-written from the family reference manual.
# VERIFIED 2026 against RM0351 Table 159 "DFSDM break connection":
# break0 -> TIM1 break, break1 -> TIM1 break2 — matches.
# match: ^STM32L4(7|8|9|A).*:TIM1.*

- match: '^STM32L4(7|8|9|A).*:TIM1.*'
  triggers:
    - signal: TIMX_BRK_IN1
      source: DFSDM1_BREAK0
    - signal: TIMX_BRK_IN2
      source: DFSDM1_BREAK1
