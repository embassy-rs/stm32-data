# Rule 69 of the original hand-maintained PERIPHERAL_TRIGGER_RULES table
# (stm32-data-gen/src/trigger.rs @ HEAD before the data-driven rewrite).
# Provenance: hand-written from the family reference manual.
# REVIEWED 2026: RM0394 (STM32L41x-46x) extraction on disk is TRUNCATED
# (chapters 0-2 only) — the DFSDM chapter tables could not be re-verified;
# hand content kept unchanged (no-download policy).
# match: ^STM32L4(1|2|3|4|5|6).*:DFSDM.*

- match: '^STM32L4(1|2|3|4|5|6).*:DFSDM.*'
  triggers:
    - signal: DFSDM1_JTRG0
      source: TIM1_TRGO
    - signal: DFSDM1_JTRG1
      source: TIM1_TRGO2
    - signal: DFSDM1_JTRG2
      source: TIM3_TRGO
    - signal: DFSDM1_JTRG3
      source: TIM16_OC1
    - signal: DFSDM1_JTRG7
      source: TIM6_TRGO
    - signal: DFSDM1_JTRG9
      source: EXTI11
    - signal: DFSDM1_JTRG10
      source: EXTI15
