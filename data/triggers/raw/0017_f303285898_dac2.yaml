# Extracted from RM0316 (STM32F303xB-C-D-E/303x6-8/328x8/358xC/398xE),
# DAC chapter 16.5.4, Table 106 "External triggers (DAC2)" (incl. continued part).
# TSEL=101 is not bonded for DAC2 (only 6 external sources; no TIM4, unlike DAC1).
# The original hand rule wrongly included TIM4_TRGO@TRG5; corrected.

- match: '^STM32F3(03|28|58|98).*:DAC2'
  triggers:
    - signal: DAC_CHX_TRG0
      source: TIM6_TRGO
    - signal: DAC_CHX_TRG1
      source: TIM3_TRGO
    - signal: DAC_CHX_TRG2
      source: TIM7_TRGO
    - signal: DAC_CHX_TRG3
      source: TIM15_TRGO
    - signal: DAC_CHX_TRG4
      source: TIM2_TRGO
    - signal: DAC_CHX_TRG6
      source: EXTI9_TRG
