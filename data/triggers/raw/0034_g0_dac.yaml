# G0 DAC trigger inputs (TSELx[3:0], v2-style 4-bit mux).
# Sources cross-checked against RM0444 (STM32G0x1), interconnect matrix,
# section 9.3.4 "From TIM1, TIM2, TIM3, TIM4, TIM6, TIM7, TIM15, LPTIM1,
# LPTIM2, and EXTI, to DAC": the TIMx_TRGO output of each timer is
# directly connected to the corresponding DAC input — the source list
# matches the entries below 1:1.
# DEFERRED: RM0444 chapter 16 (DAC), which holds Table 85 "DAC
# interconnection" (the per-index TSEL table), is NOT present in
# tmp/rm/RM0444-STM32G0x1/ (truncated extraction, stops at ch. 13), so
# the index assignments are kept from the old hand rule and could not be
# re-verified per-index on disk.
# RM0454 (STM32G0x0) has no DAC chapter on disk; among G0x0 chips only
# G070 has a DAC (SVD), and G0x0 has no LPTIM at all — whether G070's
# DAC bonds the LPTIM rows is not verifiable from the on-disk markdown.
# No extra sources for G0B1/G0C1 are documented in the on-disk RM0444
# material (chapters 15/16 missing).
# EXTI9 is written "EXTI" (EXTI line 9) in the interconnect matrix;
# normalized to EXTI9_TRG.
# match: ^STM32G0.*:DAC.*

- match: '^STM32G0.*:DAC.*'
  triggers:
    - signal: DAC_CHX_TRG1
      source: TIM1_TRGO
    - signal: DAC_CHX_TRG2
      source: TIM2_TRGO
    - signal: DAC_CHX_TRG3
      source: TIM3_TRGO
    - signal: DAC_CHX_TRG5
      source: TIM6_TRGO
    - signal: DAC_CHX_TRG6
      source: TIM7_TRGO
    - signal: DAC_CHX_TRG8
      source: TIM15_TRGO
    - signal: DAC_CHX_TRG11
      source: LPTIM1_TRGO
    - signal: DAC_CHX_TRG12
      source: LPTIM2_TRGO
    - signal: DAC_CHX_TRG13
      source: EXTI9_TRG
