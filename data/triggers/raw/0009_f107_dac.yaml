# Rule 9 of the original hand-maintained PERIPHERAL_TRIGGER_RULES table
# (stm32-data-gen/src/trigger.rs @ HEAD before the data-driven rewrite).
# Provenance: hand-written from the family reference manual.
# Verified against RM0008 table 74: TSEL[2:0]=001 is "Timer 3 TRGO event in
# connectivity line devices" (TIM8_TRGO applies to high-/XL-density only, and
# F107 has no TIM8), so the dual TIM8_TRGO entry was dropped.
# match: ^STM32F107.*:DAC.*

- match: '^STM32F107.*:DAC.*'
  triggers:
    - signal: DAC_CHX_TRG0
      source: TIM6_TRGO
    - signal: DAC_CHX_TRG1
      source: TIM3_TRGO
    - signal: DAC_CHX_TRG2
      source: TIM7_TRGO
    - signal: DAC_CHX_TRG3
      source: TIM5_TRGO
    - signal: DAC_CHX_TRG4
      source: TIM2_TRGO
    - signal: DAC_CHX_TRG5
      source: TIM4_TRGO
    - signal: DAC_CHX_TRG6
      source: EXTI9_TRG
