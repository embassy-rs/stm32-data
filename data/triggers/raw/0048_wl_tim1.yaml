# TIM1 comparator input mux for STM32WL (WL5x + WLE5).
# RM0453 (STM32WL5x) ch. 25 "Advanced-control timer (TIM1)", TIM1_OR1
# register bit 4 "TI1_RMP: Input Capture 1 remap"
# (0: TIM1 input capture 1 connected to I/O; 1: connected to COMP1 output).
# 1 entry, unchanged from the original hand rule.

- match: '^STM32WL.*:TIM1'
  triggers:
    - signal: TIMX_TI1_IN1
      source: COMP1_OUT
