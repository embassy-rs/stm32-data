# STM32U5 GPDMA1 hardware trigger inputs (CxTR2.TRIGSEL).
# RM0456 Rev 7, Table 139 "Programmed GPDMA1 trigger". Index 21 is reserved.
#
# Two rules: TIM3/4/5_TRGO (44-46) are connected only on the U59x/5Ax and
# U5Fx/5Gx (the table's footnote), though other U5s have the timers.
# Sources of peripherals a chip lacks (COMP2, LTDC, DSI, DMA2D, GPU2D,
# GFXTIM, JPEG) are trimmed per chip by the generator (source_origin).
#
# Names as in the table, upper case, except exti<n> -> EXTI<n>_TRG and
# gpdma1/lpdma1_ch<n>_tc -> GPDMA/LPDMA_CH<n>_TC (CONVENTIONS.md).

- match: '^STM32U5[9AFG].*:GPDMA1'
  triggers:
    - signal: GPDMA_TRG0
      source: EXTI0_TRG
    - signal: GPDMA_TRG1
      source: EXTI1_TRG
