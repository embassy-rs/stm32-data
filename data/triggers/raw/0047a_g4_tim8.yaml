# TIM8 interconnection inputs for STM32G4.
# Provenance: RM0440 (STM32G4) chapter 29 (TIM1/8/20): Tables 263-272
# (tim_ti1..ti4 muxes, internal trigger, tim_etr mux, break, break2,
# system break, ocref_clr mux) — the TIM8 column of each table. TIM8
# differs from TIM1 at tim_itr0 (= tim1_trgo; TIM1's itr0 is Reserved)
# and tim_itr5 (= Reserved; TIM1's itr5 is tim8_trgo). in0 rows are the
# timer's own pins (skipped); Reserved rows skipped. ti1_in1..4 =
# comp1_out..comp4_out, identical to TIM1/TIM20.
# Cross-check ch. 11 Table 63/75: TIM8 column agrees (itr10 typo
# "hrtim_out_scout2" -> hrtim_out_sync2, see 0047_g4_tim1.yaml header).
# Device restrictions: see 0047_g4_tim1.yaml header (COMP5-7, ADC4, HRTIM
# not on every G4 die; full TIM8 column emitted, restrictions noted).
# match: ^STM32G4.*:TIM8

- match: '^STM32G4.*:TIM8'
  triggers:
    - signal: TIMX_TI1_IN1
      source: COMP1_OUT
    - signal: TIMX_TI1_IN2
      source: COMP2_OUT
    - signal: TIMX_TI1_IN3
      source: COMP3_OUT
    - signal: TIMX_TI1_IN4
      source: COMP4_OUT
    - signal: TIMX_ITR_IN0
      source: TIM1_TRGO
    - signal: TIMX_ITR_IN1
      source: TIM2_TRGO
    - signal: TIMX_ITR_IN2
      source: TIM3_TRGO
    - signal: TIMX_ITR_IN3
      source: TIM4_TRGO
    - signal: TIMX_ITR_IN4
      source: TIM5_TRGO
    - signal: TIMX_ITR_IN6
      source: TIM15_TRGO
    - signal: TIMX_ITR_IN7
      source: TIM16_OC1
    - signal: TIMX_ITR_IN8
      source: TIM17_OC1
    - signal: TIMX_ITR_IN9
      source: TIM20_TRGO
    - signal: TIMX_ITR_IN10
      source: HRTIM_OUT_SYNC2
    - signal: TIMX_ETR_IN1
      source: COMP1_OUT
    - signal: TIMX_ETR_IN2
      source: COMP2_OUT
    - signal: TIMX_ETR_IN3
      source: COMP3_OUT
    - signal: TIMX_ETR_IN4
      source: COMP4_OUT
    - signal: TIMX_ETR_IN5
      source: COMP5_OUT
    - signal: TIMX_ETR_IN6
      source: COMP6_OUT
    - signal: TIMX_ETR_IN7
      source: COMP7_OUT
    - signal: TIMX_ETR_IN8
      source: ADC2_AWD1
    - signal: TIMX_ETR_IN9
      source: ADC2_AWD2
    - signal: TIMX_ETR_IN10
      source: ADC2_AWD3
    - signal: TIMX_ETR_IN11
      source: ADC3_AWD1
    - signal: TIMX_ETR_IN12
      source: ADC3_AWD2
    - signal: TIMX_ETR_IN13
      source: ADC3_AWD3
    - signal: TIMX_BRK_IN1
      source: COMP1_OUT
    - signal: TIMX_BRK_IN2
      source: COMP2_OUT
    - signal: TIMX_BRK_IN3
      source: COMP3_OUT
    - signal: TIMX_BRK_IN4
      source: COMP4_OUT
    - signal: TIMX_BRK_IN5
      source: COMP5_OUT
    - signal: TIMX_BRK_IN6
      source: COMP6_OUT
    - signal: TIMX_BRK_IN7
      source: COMP7_OUT
    - signal: TIMX_BRK2_IN1
      source: COMP1_OUT
    - signal: TIMX_BRK2_IN2
      source: COMP2_OUT
    - signal: TIMX_BRK2_IN3
      source: COMP3_OUT
    - signal: TIMX_BRK2_IN4
      source: COMP4_OUT
    - signal: TIMX_BRK2_IN5
      source: COMP5_OUT
    - signal: TIMX_BRK2_IN6
      source: COMP6_OUT
    - signal: TIMX_BRK2_IN7
      source: COMP7_OUT
    - signal: TIMX_SYS_BRK_IN0
      source: CORTEX_M4_LOCKUP
    - signal: TIMX_SYS_BRK_IN1
      source: PVD
    - signal: TIMX_SYS_BRK_IN2
      source: SRAM_PARITY_ERROR
    - signal: TIMX_SYS_BRK_IN3
      source: FLASH_ECC_ERROR
    - signal: TIMX_SYS_BRK_IN4
      source: CSS
    - signal: TIMX_OCREF_CLR_IN0
      source: COMP1_OUT
    - signal: TIMX_OCREF_CLR_IN1
      source: COMP2_OUT
    - signal: TIMX_OCREF_CLR_IN2
      source: COMP3_OUT
    - signal: TIMX_OCREF_CLR_IN3
      source: COMP4_OUT
    - signal: TIMX_OCREF_CLR_IN4
      source: COMP5_OUT
    - signal: TIMX_OCREF_CLR_IN5
      source: COMP6_OUT
    - signal: TIMX_OCREF_CLR_IN6
      source: COMP7_OUT
