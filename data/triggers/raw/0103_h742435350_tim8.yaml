# DFSDM1 watchdog-break inputs of STM32H742/743/753/750 TIM8.
# Verified against RM0433 (H742/743/753/750) Table 251 "DFSDM break connection"
# (break[2] -> TIM8 break, break[3] -> TIM8 break2).
# match: ^STM32H7(42|43|53|50).*:TIM8.*

- match: '^STM32H7(42|43|53|50).*:TIM8.*'
  triggers:
    - signal: TIMX_BRK_IN1
      source: DFSDM1_BREAK2
    - signal: TIMX_BRK_IN2
      source: DFSDM1_BREAK3
