# TIM1 comparator inputs for STM32G4.
# Provenance: RM0440 (STM32G4) Table 263 "Interconnect to the tim_ti1 input
# multiplexer" (chapter 29, TIM1/8/20 — the TIM1 column applies; TIM8 and
# TIM20 share identical rows). tim_ti1_in1..4 = comp1_out..comp4_out; all
# other tim_ti1 inputs are reserved (in0 is TIM1_CH1, the pin itself).
# Verified against the RM; content identical to the old hand rule.
# match: ^STM32G4.*:TIM1

- match: '^STM32G4.*:TIM1'
  triggers:
    - signal: TIMX_TI1_IN1
      source: COMP1_OUT
    - signal: TIMX_TI1_IN2
      source: COMP2_OUT
    - signal: TIMX_TI1_IN3
      source: COMP3_OUT
    - signal: TIMX_TI1_IN4
      source: COMP4_OUT
