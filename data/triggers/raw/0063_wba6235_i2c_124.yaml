# STM32WBA62/63/65 I2C1/I2C2/I2C4 trigger inputs.
# Provenance: DEFERRED — RM0515 (STM32WBA6) ch.39 (I2C) is NOT on disk; the
# interconnect matrix in ch.16 references Table 371 "I2C1, I2C2, and I2C4
# interconnection" at a dead link. Content kept from the old hand rule,
# cross-checked against RM0493 (STM32WBA5) ch.38 Table 357 "I2C1
# interconnection", which lists the identical 12 sources at the identical
# indices (gpdma1_chN_tc / exti5 / exti9 / lptim1_ch1 / lptim2_ch1 /
# comp1_out / comp2_out / rtc_alra_trg / rtc_wut_trg). Must be re-verified
# once the WBA6 I2C chapter is available.
# match: ^STM32WBA6[235].*:I2C[124]

- match: '^STM32WBA6[235].*:I2C[124]'
  triggers:
    - signal: I2C_TRG0
      source: GPDMA_CH0_TC
    - signal: I2C_TRG1
      source: GPDMA_CH1_TC
    - signal: I2C_TRG2
      source: GPDMA_CH2_TC
    - signal: I2C_TRG3
      source: GPDMA_CH3_TC
    - signal: I2C_TRG4
      source: EXTI5_TRG
    - signal: I2C_TRG5
      source: EXTI9_TRG
    - signal: I2C_TRG6
      source: LPTIM1_CH1
    - signal: I2C_TRG7
      source: LPTIM2_CH1
    - signal: I2C_TRG8
      source: COMP1_OUT
    - signal: I2C_TRG9
      source: COMP2_OUT
    - signal: I2C_TRG10
      source: RTC_ALRA_TRG
    - signal: I2C_TRG11
      source: RTC_WUT_TRG
