# Derived from CMSIS-SVD enumerated values (see provenance per rule).
# Source: sources/svd/<file>.svd, extracted by `trigger-svd-extract`.
# Regenerate: re-run the extractor and this script after updating SVDs.
# SVD: stm32f410.svd, peripheral ADC1, fields EXTSEL/JEXTSEL.
# Only TIM1/TIM5/EXTI11 sources are bonded out on F410.

- match: '^STM32F410.*:ADC.*'
  triggers:
    - signal: ADC_EXT_TRG0
      source: TIM1_CH1
    - signal: ADC_EXT_TRG1
      source: TIM1_CH2
    - signal: ADC_EXT_TRG2
      source: TIM1_CH3
    - signal: ADC_EXT_TRG10
      source: TIM5_CH1
    - signal: ADC_EXT_TRG11
      source: TIM5_CH2
    - signal: ADC_EXT_TRG12
      source: TIM5_CH3
    - signal: ADC_EXT_TRG15
      source: EXTI11_TRG
    - signal: ADC_JEXT_TRG0
      source: TIM1_CH4
    - signal: ADC_JEXT_TRG1
      source: TIM1_TRGO
    - signal: ADC_JEXT_TRG10
      source: TIM5_CH4
    - signal: ADC_JEXT_TRG11
      source: TIM5_TRGO
    - signal: ADC_JEXT_TRG15
      source: EXTI15_TRG
