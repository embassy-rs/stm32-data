# ADC external trigger inputs, STM32H723/733/725/735/730.
# Provenance: RM0468 (STM32H723/733/725/735/730) chapter 28, Table 226 "ADC1
# and ADC2 - External triggers for regular channels" (EXTSEL[4:0]) and Table
# 227 "... for injected channels" (JEXTSEL[4:0]); chapter 29 Table 242 "ADC
# interconnection" (ADC3) is identical for all 64 rows (verified).
# Die-specific rows vs the H742/H745 lines: EXTSEL/JEXTSEL 16/17 are Reserved
# (this line has NO HRTIM — RM0468 has no HRTIM chapter, cubedb and the
# stm32h735 SVD list no HRTIM peripheral; the stm32h735 SVD EXTSEL enum
# nevertheless lists HRTIM1_ADCTRG1/3 there, a copy-paste artifact — the SVD
# EXTSEL enums are byte-identical across ALL H7 dies — so RM wins), and
# 21/22 are TIM23_TRGO/TIM24_TRGO (dies have TIM23/TIM24, absent from the
# truncated SVD enum). Reserved rows other than those omitted.
# match: ^STM32H7(23|33|25|35|30).*:ADC(\d+)?

- match: '^STM32H7(23|33|25|35|30).*:ADC(\d+)?'
  triggers:
    - signal: ADC_EXT_TRG0
      source: TIM1_CC1
    - signal: ADC_EXT_TRG1
      source: TIM1_CC2
    - signal: ADC_EXT_TRG2
      source: TIM1_CC3
    - signal: ADC_EXT_TRG3
      source: TIM2_CC2
    - signal: ADC_EXT_TRG4
      source: TIM3_TRGO
    - signal: ADC_EXT_TRG5
      source: TIM4_CC4
    - signal: ADC_EXT_TRG6
      source: EXTI11_TRG
    - signal: ADC_EXT_TRG7
      source: TIM8_TRGO
    - signal: ADC_EXT_TRG8
      source: TIM8_TRGO2
    - signal: ADC_EXT_TRG9
      source: TIM1_TRGO
    - signal: ADC_EXT_TRG10
      source: TIM1_TRGO2
    - signal: ADC_EXT_TRG11
      source: TIM2_TRGO
    - signal: ADC_EXT_TRG12
      source: TIM4_TRGO
    - signal: ADC_EXT_TRG13
      source: TIM6_TRGO
    - signal: ADC_EXT_TRG14
      source: TIM15_TRGO
    - signal: ADC_EXT_TRG15
      source: TIM3_CC4
    - signal: ADC_EXT_TRG18
      source: LPTIM1_TRGO
    - signal: ADC_EXT_TRG19
      source: LPTIM2_TRGO
    - signal: ADC_EXT_TRG20
      source: LPTIM3_TRGO
    - signal: ADC_EXT_TRG21
      source: TIM23_TRGO
    - signal: ADC_EXT_TRG22
      source: TIM24_TRGO
    - signal: ADC_JEXT_TRG0
      source: TIM1_TRGO
    - signal: ADC_JEXT_TRG1
      source: TIM1_CC4
    - signal: ADC_JEXT_TRG2
      source: TIM2_TRGO
    - signal: ADC_JEXT_TRG3
      source: TIM2_CC1
    - signal: ADC_JEXT_TRG4
      source: TIM3_CC4
    - signal: ADC_JEXT_TRG5
      source: TIM4_TRGO
    - signal: ADC_JEXT_TRG6
      source: EXTI15_TRG
    - signal: ADC_JEXT_TRG7
      source: TIM8_CC4
    - signal: ADC_JEXT_TRG8
      source: TIM1_TRGO2
    - signal: ADC_JEXT_TRG9
      source: TIM8_TRGO
    - signal: ADC_JEXT_TRG10
      source: TIM8_TRGO2
    - signal: ADC_JEXT_TRG11
      source: TIM3_CC3
    - signal: ADC_JEXT_TRG12
      source: TIM3_TRGO
    - signal: ADC_JEXT_TRG13
      source: TIM3_CC1
    - signal: ADC_JEXT_TRG14
      source: TIM6_TRGO
    - signal: ADC_JEXT_TRG15
      source: TIM15_TRGO
    - signal: ADC_JEXT_TRG18
      source: LPTIM1_TRGO
    - signal: ADC_JEXT_TRG19
      source: LPTIM2_TRGO
    - signal: ADC_JEXT_TRG20
      source: LPTIM3_TRGO
    - signal: ADC_JEXT_TRG21
      source: TIM23_TRGO
    - signal: ADC_JEXT_TRG22
