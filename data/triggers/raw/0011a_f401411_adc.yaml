# Derived from CMSIS-SVD enumerated values (see provenance per rule).
# Source: sources/svd/<file>.svd, extracted by `trigger-svd-extract`.
# Regenerate: re-run the extractor and this script after updating SVDs.
# SVD: stm32f{401,411}.svd, peripheral ADC1, fields EXTSEL/JEXTSEL.
# No TIM8 on these dies.

- match: '^STM32F4(01|11).*:ADC.*'
  triggers:
    - signal: ADC_EXT_TRG0
      source: TIM1_CH1
    - signal: ADC_EXT_TRG1
      source: TIM1_CH2
    - signal: ADC_EXT_TRG2
      source: TIM1_CH3
    - signal: ADC_EXT_TRG3
      source: TIM2_CH2
    - signal: ADC_EXT_TRG4
      source: TIM2_CH3
    - signal: ADC_EXT_TRG5
      source: TIM2_CH4
    - signal: ADC_EXT_TRG6
      source: TIM2_TRGO
    - signal: ADC_EXT_TRG7
      source: TIM3_CH1
    - signal: ADC_EXT_TRG8
      source: TIM3_TRGO
    - signal: ADC_EXT_TRG9
      source: TIM4_CH4
    - signal: ADC_EXT_TRG10
      source: TIM5_CH1
    - signal: ADC_EXT_TRG11
      source: TIM5_CH2
    - signal: ADC_EXT_TRG12
      source: TIM5_CH3
    - signal: ADC_EXT_TRG15
      source: EXTI11_TRG
    - signal: ADC_JEXT_TRG0
      source: TIM1_CH4
    - signal: ADC_JEXT_TRG1
      source: TIM1_TRGO
    - signal: ADC_JEXT_TRG2
      source: TIM2_CH1
    - signal: ADC_JEXT_TRG3
      source: TIM2_TRGO
    - signal: ADC_JEXT_TRG4
      source: TIM3_CH2
    - signal: ADC_JEXT_TRG5
      source: TIM3_CH4
    - signal: ADC_JEXT_TRG6
      source: TIM4_CH1
    - signal: ADC_JEXT_TRG7
      source: TIM4_CH2
    - signal: ADC_JEXT_TRG8
      source: TIM4_CH3
    - signal: ADC_JEXT_TRG9
      source: TIM4_TRGO
    - signal: ADC_JEXT_TRG10
      source: TIM5_CH4
    - signal: ADC_JEXT_TRG11
      source: TIM5_TRGO
    - signal: ADC_JEXT_TRG15
      source: EXTI15_TRG
