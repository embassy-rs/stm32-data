# Verified against RM0503 (STM32U0), DAC chapter 15, Table 80 "DAC
# interconnection" (with "(continued)" part — rows concatenated):
# dac_ch1_trg1 tim1_trgo, trg2 tim2_trgo, trg3 tim3_trgo, trg5 tim6_trgo,
# trg6 tim7_trgo, trg8 tim15_trgo, trg11 lptim1_out, trg12 lptim2_out,
# trg14 exti9. Normalized per CONVENTIONS.md: lptim{n}_out → LPTIM{n}_TRGO,
# exti9 → EXTI9_TRG. Matches the original hand rule exactly — content
# unchanged.
# match: ^STM32U0.*:DAC.*

- match: '^STM32U0.*:DAC.*'
  triggers:
    - signal: DAC_CHX_TRG1
      source: TIM1_TRGO
    - signal: DAC_CHX_TRG2
      source: TIM2_TRGO
    - signal: DAC_CHX_TRG3
      source: TIM3_TRGO
    - signal: DAC_CHX_TRG5
      source: TIM6_TRGO
    - signal: DAC_CHX_TRG6
      source: TIM7_TRGO
    - signal: DAC_CHX_TRG8
      source: TIM15_TRGO
    - signal: DAC_CHX_TRG11
      source: LPTIM1_TRGO
    - signal: DAC_CHX_TRG12
      source: LPTIM2_TRGO
    - signal: DAC_CHX_TRG14
      source: EXTI9_TRG
