# ADC external trigger inputs, STM32H7A3/7B3/7B0.
# Provenance: SVD-derived from stm32h7b3 (ADC1 and ADC2 CFGR EXTSEL / JSQR
# JEXTSEL enumerated values — ADC1 and ADC2 enums byte-identical). RM0455's
# ADC chapter is NOT extracted in tmp/rm (folder truncated at ch. 6), so the
# enum was spot-checked against the RM0433/RM0399 tables instead: values
# 0..15 and 18..20 are identical to the H742/H745-line rows above.
# Values 16/17 (HRTIM1_ADCTRG1/3) are OMITTED: no die matched by this rule
# has an HRTIM peripheral (cubedb lists no HRTIM instance for any
# H7A3/B3/B0 part, stm32h7b3.svd has no HRTIM peripheral, and RM0455's TOC
# has no HRTIM chapter) — the SVD enum is a copy-paste artifact (the H7 EXTSEL
# enums are byte-identical across all H7 dies). Per CONVENTIONS.md, sources
# for peripherals absent from every matching die are not emitted. The enum
# ends at 20 (no TIM23/TIM24 rows; those timers do not exist on this line).
# match: ^STM32H7(A3|B3|B0).*:ADC(\d+)?

- match: '^STM32H7(A3|B3|B0).*:ADC(\d+)?'
  triggers:
    - signal: ADC_EXT_TRG0
      source: TIM1_CC1
    - signal: ADC_EXT_TRG1
      source: TIM1_CC2
    - signal: ADC_EXT_TRG2
      source: TIM1_CC3
    - signal: ADC_EXT_TRG3
      source: TIM2_CC2
    - signal: ADC_EXT_TRG4
      source: TIM3_TRGO
    - signal: ADC_EXT_TRG5
      source: TIM4_CC4
    - signal: ADC_EXT_TRG6
      source: EXTI11_TRG
    - signal: ADC_EXT_TRG7
      source: TIM8_TRGO
    - signal: ADC_EXT_TRG8
      source: TIM8_TRGO2
    - signal: ADC_EXT_TRG9
      source: TIM1_TRGO
    - signal: ADC_EXT_TRG10
      source: TIM1_TRGO2
    - signal: ADC_EXT_TRG11
      source: TIM2_TRGO
    - signal: ADC_EXT_TRG12
      source: TIM4_TRGO
    - signal: ADC_EXT_TRG13
      source: TIM6_TRGO
    - signal: ADC_EXT_TRG14
      source: TIM15_TRGO
    - signal: ADC_EXT_TRG15
      source: TIM3_CC4
    - signal: ADC_EXT_TRG18
      source: LPTIM1_TRGO
    - signal: ADC_EXT_TRG19
      source: LPTIM2_TRGO
    - signal: ADC_EXT_TRG20
      source: LPTIM3_TRGO
    - signal: ADC_JEXT_TRG0
      source: TIM1_TRGO
    - signal: ADC_JEXT_TRG1
      source: TIM1_CC4
    - signal: ADC_JEXT_TRG2
      source: TIM2_TRGO
    - signal: ADC_JEXT_TRG3
      source: TIM2_CC1
    - signal: ADC_JEXT_TRG4
      source: TIM3_CC4
    - signal: ADC_JEXT_TRG5
      source: TIM4_TRGO
    - signal: ADC_JEXT_TRG6
      source: EXTI15_TRG
    - signal: ADC_JEXT_TRG7
      source: TIM8_CC4
    - signal: ADC_JEXT_TRG8
      source: TIM1_TRGO2
    - signal: ADC_JEXT_TRG9
      source: TIM8_TRGO
    - signal: ADC_JEXT_TRG10
      source: TIM8_TRGO2
    - signal: ADC_JEXT_TRG11
      source: TIM3_CC3
    - signal: ADC_JEXT_TRG12
      source: TIM3_TRGO
    - signal: ADC_JEXT_TRG13
      source: TIM3_CC1
    - signal: ADC_JEXT_TRG14
      source: TIM6_TRGO
    - signal: ADC_JEXT_TRG15
      source: TIM15_TRGO
    - signal: ADC_JEXT_TRG18
      source: LPTIM1_TRGO
    - signal: ADC_JEXT_TRG19
      source: LPTIM2_TRGO
    - signal: ADC_JEXT_TRG20
      source: LPTIM3_TRGO
