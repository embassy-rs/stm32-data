# DFSDM1 watchdog-break inputs of STM32H742/743/753/750 TIM17.
# Verified against RM0433 (H742/743/753/750) Table 251 "DFSDM break connection"
# (break[2] -> TIM8 break / TIM17 break).
# match: ^STM32H7(42|43|53|50).*:TIM17.*

- match: '^STM32H7(42|43|53|50).*:TIM17.*'
  triggers:
    - signal: TIMX_BRK_IN1
      source: DFSDM1_BREAK2
