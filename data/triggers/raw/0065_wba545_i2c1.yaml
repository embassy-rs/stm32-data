# STM32WBA54/55 I2C1 trigger inputs.
# Provenance: RM0493 (STM32WBA5) ch.38 (I2C), Table 357 "I2C1
# interconnection": i2c_trg0..11 = gpdma1_ch0..3_tc, exti5, exti9,
# lptim1_ch1, lptim2_ch1, comp1_out, comp2_out, rtc_alra_trg, rtc_wut_trg;
# trg12..15 Reserved. Verified against the RM; identical to the old hand
# rule. (WBA5 has no I2C2/I2C4, so this rule matching only I2C1 is correct.)
# match: ^STM32WBA5[45].*:I2C1

- match: '^STM32WBA5[45].*:I2C1'
  triggers:
    - signal: I2C_TRG0
      source: GPDMA_CH0_TC
    - signal: I2C_TRG1
      source: GPDMA_CH1_TC
    - signal: I2C_TRG2
      source: GPDMA_CH2_TC
    - signal: I2C_TRG3
      source: GPDMA_CH3_TC
    - signal: I2C_TRG4
      source: EXTI5_TRG
    - signal: I2C_TRG5
      source: EXTI9_TRG
    - signal: I2C_TRG6
      source: LPTIM1_CH1
    - signal: I2C_TRG7
      source: LPTIM2_CH1
    - signal: I2C_TRG8
      source: COMP1_OUT
    - signal: I2C_TRG9
      source: COMP2_OUT
    - signal: I2C_TRG10
      source: RTC_ALRA_TRG
    - signal: I2C_TRG11
      source: RTC_WUT_TRG
