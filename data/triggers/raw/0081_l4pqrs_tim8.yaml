# Rule 81 of the original hand-maintained PERIPHERAL_TRIGGER_RULES table
# (stm32-data-gen/src/trigger.rs @ HEAD before the data-driven rewrite).
# Provenance: hand-written from the family reference manual.
# REVIEWED 2026: RM0432 DFSDM tables not on disk (truncated extraction);
# hand content kept — see rule 0078's header for the RM0438/RM0432-index
# corroboration of the L4+ break wiring.
# match: ^STM32L4(P|Q|R|S).*:TIM8.*

- match: '^STM32L4(P|Q|R|S).*:TIM8.*'
  triggers:
    - signal: TIMX_BRK_IN1
      source: DFSDM1_BREAK2
    - signal: TIMX_BRK_IN2
      source: DFSDM1_BREAK3
