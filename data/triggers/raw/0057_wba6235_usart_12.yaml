# STM32WBA62/63/65 USART1/USART2 trigger inputs.
# Provenance: DEFERRED — RM0515 (STM32WBA6) ch.40 (USART) is NOT on disk; the
# interconnect matrix in ch.16 references Table 391 "USART interconnection
# (USART1/2)" at a dead link. Content kept from the old hand rule,
# cross-checked against RM0493 (STM32WBA5) ch.39 Table 377 "USART
# interconnection (USART1/2)", which lists the identical 12 sources at the
# identical indices (gpdma1_chN_tc / exti6 / exti9 / lptim1_ch1 / lptim2_ch1
# / comp1_out / comp2_out / rtc_alra_trg / rtc_wut_trg). Must be re-verified
# once the WBA6 USART chapter is available.
# match: ^STM32WBA6[235].*:USART[12]

- match: '^STM32WBA6[235].*:USART[12]'
  triggers:
    - signal: USART_TRG0
      source: GPDMA_CH0_TC
    - signal: USART_TRG1
      source: GPDMA_CH1_TC
    - signal: USART_TRG2
      source: GPDMA_CH2_TC
    - signal: USART_TRG3
      source: GPDMA_CH3_TC
    - signal: USART_TRG4
      source: EXTI6_TRG
    - signal: USART_TRG5
      source: EXTI9_TRG
    - signal: USART_TRG6
      source: LPTIM1_CH1
    - signal: USART_TRG7
      source: LPTIM2_CH1
    - signal: USART_TRG8
      source: COMP1_OUT
    - signal: USART_TRG9
      source: COMP2_OUT
    - signal: USART_TRG10
      source: RTC_ALRA_TRG
    - signal: USART_TRG11
      source: RTC_WUT_TRG
