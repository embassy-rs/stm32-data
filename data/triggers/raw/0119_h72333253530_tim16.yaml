# DFSDM1 watchdog-break inputs of STM32H723/733/725/735/730 TIM16.
# NOT covered by any RM in tmp/rm (RM0433 covers H742/743/753/750, RM0399 covers
# H745/755/747/757) — content kept from the original hand rules (break[1] -> TIM1 break2 / TIM16 break).
# match: ^STM32H7(23|33|25|35|30).*:TIM16.*

- match: '^STM32H7(23|33|25|35|30).*:TIM16.*'
  triggers:
    - signal: TIMX_BRK_IN1
      source: DFSDM1_BREAK1
