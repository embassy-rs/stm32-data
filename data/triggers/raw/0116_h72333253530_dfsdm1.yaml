# DFSDM1 injected trigger inputs, STM32H723/733/725/735/730.
# NOT covered by any RM in tmp/rm (RM0433 covers H742/743/753/750, RM0399 covers
# H745/755/747/757) — content kept from the original hand rules. Same table as
# RM0433 Table 250 for H743 minus the HRTIM entries (no HRTIM on H72x/73x),
# plus TIM23/24_TRGO at jtrg11/12. EXTI sources are plain EXTI{n} (DFSDM
# convention).
# match: ^STM32H7(23|33|25|35|30).*:DFSDM1.*

- match: '^STM32H7(23|33|25|35|30).*:DFSDM1.*'
  triggers:
    - signal: DFSDM1_JTRG0
      source: TIM1_TRGO
    - signal: DFSDM1_JTRG1
      source: TIM1_TRGO2
    - signal: DFSDM1_JTRG2
      source: TIM8_TRGO
    - signal: DFSDM1_JTRG3
      source: TIM8_TRGO2
    - signal: DFSDM1_JTRG4
      source: TIM3_TRGO
    - signal: DFSDM1_JTRG5
      source: TIM4_TRGO
    - signal: DFSDM1_JTRG6
      source: TIM16_OC1
    - signal: DFSDM1_JTRG7
      source: TIM6_TRGO
    - signal: DFSDM1_JTRG8
      source: TIM7_TRGO
    - signal: DFSDM1_JTRG11
      source: TIM23_TRGO
    - signal: DFSDM1_JTRG12
      source: TIM24_TRGO
    - signal: DFSDM1_JTRG24
      source: EXTI11
    - signal: DFSDM1_JTRG25
      source: EXTI15
    - signal: DFSDM1_JTRG26
      source: LPTIM1_TRGO
    - signal: DFSDM1_JTRG27
      source: LPTIM2_TRGO
    - signal: DFSDM1_JTRG28
      source: LPTIM3_TRGO
