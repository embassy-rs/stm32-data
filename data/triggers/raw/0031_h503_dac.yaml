# Rule 31 of the original hand-maintained PERIPHERAL_TRIGGER_RULES table
# (stm32-data-gen/src/trigger.rs @ HEAD before the data-driven rewrite).
# DEFERRED — no RM available on disk: the RM0481 extraction is truncated at
# chapter 15; the DAC chapter (ch. 28, Table 281 "DAC interconnection") is not
# on disk, so the per-index TSEL values could not be re-verified. Content kept
# from the hand rules.
# Partially corroborated by RM0481 ch. 15 §15.3.4 (triggers to DAC): source set
# for the family is TIM1/2/4/5/6/7/8/15, LPTIM1/2 (ch1) and EXTI9; H503 lacks
# TIM4/5/8/15, so the hand rule's 9-entry subset (TIM1/2/3/6/7, LPTIM1/2,
# EXTI9) is consistent with that.
# match: ^STM32H503.*:DAC.*

- match: '^STM32H503.*:DAC.*'
  triggers:
    - signal: DAC_CHX_TRG3
      source: TIM3_TRGO
    - signal: DAC_CHX_TRG1
      source: TIM1_TRGO
    - signal: DAC_CHX_TRG2
      source: TIM2_TRGO
    - signal: DAC_CHX_TRG5
      source: TIM6_TRGO
    - signal: DAC_CHX_TRG6
      source: TIM7_TRGO
    - signal: DAC_CHX_TRG11
      source: LPTIM1_TRGO
    - signal: DAC_CHX_TRG12
      source: LPTIM2_TRGO
    - signal: DAC_CHX_TRG13
      source: EXTI9_TRG
