# STM32WBA62/63/65 LPTIM1 inputs.
# Provenance: RM0515 (STM32WBA6) ch.33 (LPTIM): Table 325 (LPTIM1/2 external
# trigger connections), Table 326 (input 1), Table 327 (input 2), Table 328
# (input capture 1), Table 329 (input capture 2). Verified against the RM;
# identical to the old hand rule. lptim_ext_trig5 is Reserved for LPTIM1 and
# lptim_in2_mux2 is LSE (LPTIM1) / Reserved (LPTIM2), per the tables.
# match: ^STM32WBA6[235].*:LPTIM1

- match: '^STM32WBA6[235].*:LPTIM1'
  triggers:
    - signal: LPTIM_EXT_TRG0
      source: LPTIM1_ETR
    - signal: LPTIM_EXT_TRG1
      source: RTC_ALRA_TRG
    - signal: LPTIM_EXT_TRG2
      source: RTC_ALRB_TRG
    - signal: LPTIM_EXT_TRG3
      source: TAMP_TRG1
    - signal: LPTIM_EXT_TRG4
      source: TAMP_TRG2
    - signal: LPTIM_EXT_TRG6
      source: COMP1_OUT
    - signal: LPTIM_EXT_TRG7
      source: COMP2_OUT
    - signal: LPTIM_IN1_MUX0
      source: LPTIM1_IN1
    - signal: LPTIM_IN1_MUX1
      source: COMP1_OUT
    - signal: LPTIM_IN2_MUX0
      source: LPTIM1_IN2
    - signal: LPTIM_IN2_MUX1
      source: COMP2_OUT
    - signal: LPTIM_IC1_MUX0
      source: LPTIM1_CH1
    - signal: LPTIM_IC1_MUX1
      source: COMP1_OUT
    - signal: LPTIM_IC1_MUX2
      source: COMP2_OUT
    - signal: LPTIM_IC2_MUX0
      source: LPTIM1_CH2
    - signal: LPTIM_IC2_MUX1
      source: LSI
    - signal: LPTIM_IC2_MUX2
      source: LSE
