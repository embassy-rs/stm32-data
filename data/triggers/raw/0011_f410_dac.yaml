# Rule 11 of the original hand-maintained PERIPHERAL_TRIGGER_RULES table
# (stm32-data-gen/src/trigger.rs @ HEAD before the data-driven rewrite).
# Provenance: hand-written from the family reference manual.
# Verified against RM0401 table 52: F410 bonds only TIM5 TRGO (TSEL=011) and
# EXTI line9 (TSEL=110); all other TSEL values are not bonded (SWTRIG at 111).
# match: ^STM32F410.*:DAC.*

- match: '^STM32F410.*:DAC.*'
  triggers:
    - signal: DAC_CHX_TRG3
      source: TIM5_TRGO
    - signal: DAC_CHX_TRG6
      source: EXTI9_TRG
