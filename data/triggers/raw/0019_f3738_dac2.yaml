# Extracted from RM0313 (STM32F37), DAC chapter 14.5.4,
# Table 41 "External triggers (DAC2)".
# Corrects the original hand rule: EXTI9 is TSEL=110 (was wrongly 5);
# TIM4_TRGO@TSEL=101 was missing. DAC2 uses TIM18_TRGO@TRG3 instead of DAC1's
# TIM5_TRGO. The RM documents no F373/F378 differences in these tables.

- match: '^STM32F37(3|8).*:DAC2'
  triggers:
    - signal: DAC_CHX_TRG0
      source: TIM6_TRGO
    - signal: DAC_CHX_TRG1
      source: TIM3_TRGO
    - signal: DAC_CHX_TRG2
      source: TIM7_TRGO
    - signal: DAC_CHX_TRG3
      source: TIM18_TRGO
    - signal: DAC_CHX_TRG4
      source: TIM2_TRGO
    - signal: DAC_CHX_TRG5
      source: TIM4_TRGO
    - signal: DAC_CHX_TRG6
      source: EXTI9_TRG
