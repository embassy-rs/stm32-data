# TIM20 interconnection inputs for STM32G4.
# Provenance: RM0440 (STM32G4) chapter 29 (TIM1/8/20): Tables 263-272 —
# the TIM20 column of each table. TIM20 differs from TIM1 at tim_itr9
# (= Reserved, its own TRGO; TIM1's itr9 is tim20_trgo); itr0..8 and
# itr10 are identical to TIM8. in0 rows are the timer's own pins
# (skipped); Reserved rows skipped.
# Cross-check ch. 11 Table 63/75: TIM20 column agrees (itr10 typo
# "hrtim_out_scout2" -> hrtim_out_sync2, see 0047_g4_tim1.yaml header).
# Device restrictions: TIM20 exists on G411/G414/G471/G473/G474/G483/
# G484/G491/G4A1 only (the match regex only fires where the peripheral
# exists). Per cubedb: COMP5-7 only on G414/G473/G474/G483/G484; HRTIM
# (HRTIM_OUT_SYNC2) only on G414/G474/G484 — G471/G491/G4A1 have no
# HRTIM; ADC3 exists on all TIM20 dies except G411/G414; ADC5 only on
# G473/G474/G483/G484. The RM tables carry no per-die footnotes, so the
# full TIM20 column is emitted and the restrictions noted here.
# match: ^STM32G4.*:TIM20

- match: '^STM32G4.*:TIM20'
  triggers:
    - signal: TIMX_TI1_IN1
      source: COMP1_OUT
    - signal: TIMX_TI1_IN2
      source: COMP2_OUT
    - signal: TIMX_TI1_IN3
      source: COMP3_OUT
    - signal: TIMX_TI1_IN4
      source: COMP4_OUT
    - signal: TIMX_ITR_IN0
      source: TIM1_TRGO
    - signal: TIMX_ITR_IN1
      source: TIM2_TRGO
    - signal: TIMX_ITR_IN2
      source: TIM3_TRGO
    - signal: TIMX_ITR_IN3
      source: TIM4_TRGO
    - signal: TIMX_ITR_IN4
      source: TIM5_TRGO
    - signal: TIMX_ITR_IN5
      source: TIM8_TRGO
    - signal: TIMX_ITR_IN6
      source: TIM15_TRGO
    - signal: TIMX_ITR_IN7
      source: TIM16_OC1
    - signal: TIMX_ITR_IN8
      source: TIM17_OC1
    - signal: TIMX_ITR_IN10
      source: HRTIM_OUT_SYNC2
    - signal: TIMX_ETR_IN1
      source: COMP1_OUT
    - signal: TIMX_ETR_IN2
      source: COMP2_OUT
    - signal: TIMX_ETR_IN3
      source: COMP3_OUT
    - signal: TIMX_ETR_IN4
      source: COMP4_OUT
    - signal: TIMX_ETR_IN5
      source: COMP5_OUT
    - signal: TIMX_ETR_IN6
      source: COMP6_OUT
    - signal: TIMX_ETR_IN7
      source: COMP7_OUT
    - signal: TIMX_ETR_IN8
      source: ADC3_AWD1
    - signal: TIMX_ETR_IN9
      source: ADC3_AWD2
    - signal: TIMX_ETR_IN10
      source: ADC3_AWD3
    - signal: TIMX_ETR_IN11
      source: ADC5_AWD1
    - signal: TIMX_ETR_IN12
      source: ADC5_AWD2
    - signal: TIMX_ETR_IN13
      source: ADC5_AWD3
    - signal: TIMX_BRK_IN1
      source: COMP1_OUT
    - signal: TIMX_BRK_IN2
      source: COMP2_OUT
    - signal: TIMX_BRK_IN3
      source: COMP3_OUT
    - signal: TIMX_BRK_IN4
      source: COMP4_OUT
    - signal: TIMX_BRK_IN5
      source: COMP5_OUT
    - signal: TIMX_BRK_IN6
      source: COMP6_OUT
    - signal: TIMX_BRK_IN7
      source: COMP7_OUT
    - signal: TIMX_BRK2_IN1
      source: COMP1_OUT
    - signal: TIMX_BRK2_IN2
      source: COMP2_OUT
    - signal: TIMX_BRK2_IN3
      source: COMP3_OUT
    - signal: TIMX_BRK2_IN4
      source: COMP4_OUT
    - signal: TIMX_BRK2_IN5
      source: COMP5_OUT
    - signal: TIMX_BRK2_IN6
      source: COMP6_OUT
    - signal: TIMX_BRK2_IN7
      source: COMP7_OUT
    - signal: TIMX_SYS_BRK_IN0
      source: CORTEX_M4_LOCKUP
    - signal: TIMX_SYS_BRK_IN1
      source: PVD
    - signal: TIMX_SYS_BRK_IN2
      source: SRAM_PARITY_ERROR
    - signal: TIMX_SYS_BRK_IN3
      source: FLASH_ECC_ERROR
    - signal: TIMX_SYS_BRK_IN4
      source: CSS
    - signal: TIMX_OCREF_CLR_IN0
      source: COMP1_OUT
    - signal: TIMX_OCREF_CLR_IN1
      source: COMP2_OUT
    - signal: TIMX_OCREF_CLR_IN2
      source: COMP3_OUT
    - signal: TIMX_OCREF_CLR_IN3
      source: COMP4_OUT
    - signal: TIMX_OCREF_CLR_IN4
      source: COMP5_OUT
    - signal: TIMX_OCREF_CLR_IN5
      source: COMP6_OUT
    - signal: TIMX_OCREF_CLR_IN6
      source: COMP7_OUT
