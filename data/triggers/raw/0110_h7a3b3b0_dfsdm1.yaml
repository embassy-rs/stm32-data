# DFSDM1 injected trigger inputs, STM32H7A3/7B3/7B0.
# NOT covered by any RM in tmp/rm (RM0433/RM0399 cover H743 and H745 only) —
# content kept from the original hand rules. Same table as RM0433 Table 250 for
# H743 minus the HRTIM entries (no HRTIM on H7A3/B3/B0), plus COMP1/2 at
# jtrg29/30. EXTI sources are plain EXTI{n} (DFSDM convention).
# match: ^STM32H7(A3|B3|B0).*:DFSDM1.*

- match: '^STM32H7(A3|B3|B0).*:DFSDM1.*'
  triggers:
    - signal: DFSDM1_JTRG0
      source: TIM1_TRGO
    - signal: DFSDM1_JTRG1
      source: TIM1_TRGO2
    - signal: DFSDM1_JTRG2
      source: TIM8_TRGO
    - signal: DFSDM1_JTRG3
      source: TIM8_TRGO2
    - signal: DFSDM1_JTRG4
      source: TIM3_TRGO
    - signal: DFSDM1_JTRG5
      source: TIM4_TRGO
    - signal: DFSDM1_JTRG6
      source: TIM16_OC1
    - signal: DFSDM1_JTRG7
      source: TIM6_TRGO
    - signal: DFSDM1_JTRG8
      source: TIM7_TRGO
    - signal: DFSDM1_JTRG24
      source: EXTI11
    - signal: DFSDM1_JTRG25
      source: EXTI15
    - signal: DFSDM1_JTRG26
      source: LPTIM1_TRGO
    - signal: DFSDM1_JTRG27
      source: LPTIM2_TRGO
    - signal: DFSDM1_JTRG28
      source: LPTIM3_TRGO
    - signal: DFSDM1_JTRG29
      source: COMP1_OUT
    - signal: DFSDM1_JTRG30
      source: COMP2_OUT
