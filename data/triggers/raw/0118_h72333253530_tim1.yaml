# DFSDM1 watchdog-break inputs of STM32H723/733/725/735/730 TIM1.
# NOT covered by any RM in tmp/rm (RM0433 covers H742/743/753/750, RM0399 covers
# H745/755/747/757) — content kept from the original hand rules (break[0] -> TIM1 break, break[1] -> TIM1 break2).
# match: ^STM32H7(23|33|25|35|30).*:TIM1.*

- match: '^STM32H7(23|33|25|35|30).*:TIM1.*'
  triggers:
    - signal: TIMX_BRK_IN1
      source: DFSDM1_BREAK0
    - signal: TIMX_BRK_IN2
      source: DFSDM1_BREAK1
