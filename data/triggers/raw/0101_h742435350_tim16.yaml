# DFSDM1 watchdog-break inputs of STM32H742/743/753/750 TIM16.
# Verified against RM0433 (H742/743/753/750) Table 251 "DFSDM break connection"
# (break[1] -> TIM1 break2 / TIM16 break).
# match: ^STM32H7(42|43|53|50).*:TIM16.*

- match: '^STM32H7(42|43|53|50).*:TIM16.*'
  triggers:
    - signal: TIMX_BRK_IN1
      source: DFSDM1_BREAK1
