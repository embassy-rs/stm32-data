# STM32WBA62/63/65 SPI3 trigger inputs.
# Provenance: DEFERRED — RM0515 (STM32WBA6) ch.42 (SPI) is NOT on disk; the
# interconnect matrix in ch.16 references Table 414 "SPI interconnection
# (SPI3)" at a dead link. Content kept from the old hand rule, cross-checked
# against RM0493 (STM32WBA5) ch.41 Table 400 "SPI interconnection (SPI3)",
# which is identical (exti8 at TRG5; TRG7/TRG9 Reserved — no LPTIM2_CH1 /
# COMP2_OUT on SPI3). Must be re-verified once the WBA6 SPI chapter is
# available.
# match: ^STM32WBA6[235].*:SPI3

- match: '^STM32WBA6[235].*:SPI3'
  triggers:
    - signal: SPI_TRG0
      source: GPDMA_CH0_TC
    - signal: SPI_TRG1
      source: GPDMA_CH1_TC
    - signal: SPI_TRG2
      source: GPDMA_CH2_TC
    - signal: SPI_TRG3
      source: GPDMA_CH3_TC
    - signal: SPI_TRG4
      source: EXTI4_TRG
    - signal: SPI_TRG5
      source: EXTI8_TRG
    - signal: SPI_TRG6
      source: LPTIM1_CH1
    - signal: SPI_TRG8
      source: COMP1_OUT
    - signal: SPI_TRG10
      source: RTC_ALRA_TRG
    - signal: SPI_TRG11
      source: RTC_WUT_TRG
