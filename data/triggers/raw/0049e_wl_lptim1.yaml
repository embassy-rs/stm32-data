# LPTIM1 interconnection inputs for STM32WL (WL5x + WLE5).
# Provenance: RM0461 (STM32WLEx) ch. 26 / RM0453 (STM32WL5x) ch. 28:
# - Table 181 "LPTIM1 external trigger connections"
# - LPTIM1_OR bits 1:0 (OR_0: COMP1_OUT, OR_1: COMP2_OUT)

- match: '^STM32WL.*:LPTIM1'
  triggers:
    - signal: LPTIM_EXT_TRG0
      source: LPTIM1_ETR
    - signal: LPTIM_EXT_TRG1
      source: RTC_ALRA_TRG
    - signal: LPTIM_EXT_TRG2
      source: RTC_ALRB_TRG
    - signal: LPTIM_EXT_TRG3
      source: TAMP_TRG1
    - signal: LPTIM_EXT_TRG4
      source: TAMP_TRG2
    - signal: LPTIM_EXT_TRG5
      source: TAMP_TRG3
    - signal: LPTIM_EXT_TRG6
      source: COMP1_OUT
    - signal: LPTIM_EXT_TRG7
      source: COMP2_OUT
    - signal: LPTIM_IN1_MUX0
      source: LPTIM1_IN1
    - signal: LPTIM_IN1_MUX1
      source: COMP1_OUT
    - signal: LPTIM_IN2_MUX0
      source: LPTIM1_IN2
    - signal: LPTIM_IN2_MUX1
      source: COMP2_OUT
