# Rule 91 of the original hand-maintained PERIPHERAL_TRIGGER_RULES table
# (stm32-data-gen/src/trigger.rs @ HEAD before the data-driven rewrite).
# Provenance: hand-written from the family reference manual.
# match: ^STM32F7(6|7).*:DFSDM.*

- match: '^STM32F7(6|7).*:DFSDM.*'
  triggers:
    - signal: DFSDM1_JTRG0
      source: TIM1_TRGO
    - signal: DFSDM1_JTRG1
      source: TIM1_TRGO2
    - signal: DFSDM1_JTRG2
      source: TIM8_TRGO
    - signal: DFSDM1_JTRG3
      source: TIM8_TRGO2
    - signal: DFSDM1_JTRG4
      source: TIM3_TRGO
    - signal: DFSDM1_JTRG5
      source: TIM4_TRGO
    - signal: DFSDM1_JTRG6
      source: TIM10_OC1
    - signal: DFSDM1_JTRG7
      source: TIM6_TRGO
    - signal: DFSDM1_JTRG8
      source: TIM7_TRGO
    - signal: DFSDM1_JTRG24
      source: EXTI11
    - signal: DFSDM1_JTRG25
      source: EXTI15
    - signal: DFSDM1_JTRG26
      source: LPTIM1_TRGO
