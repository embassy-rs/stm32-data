# Rule 72 of the original hand-maintained PERIPHERAL_TRIGGER_RULES table
# (stm32-data-gen/src/trigger.rs @ HEAD before the data-driven rewrite).
# Provenance: hand-written from the family reference manual.
# REVIEWED 2026: RM0394 (STM32L41x-46x) extraction on disk is TRUNCATED
# (chapters 0-2 only) — the DFSDM chapter tables could not be re-verified;
# hand content kept unchanged (no-download policy).
# match: ^STM32L4(1|2|3|4|5|6).*:TIM16.*

- match: '^STM32L4(1|2|3|4|5|6).*:TIM16.*'
  triggers:
    - signal: TIMX_BRK_IN1
      source: DFSDM1_BREAK3
