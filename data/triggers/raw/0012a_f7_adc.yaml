# Derived from CMSIS-SVD enumerated values (see provenance per rule).
# Source: sources/svd/<file>.svd, extracted by `trigger-svd-extract`.
# Regenerate: re-run the extractor and this script after updating SVDs.
# SVD: stm32f{730,745,750,765,7x2,7x3,7x6,7x7,7x9}.svd, peripheral ADC1/ADC2,
# fields EXTSEL/JEXTSEL. All F7 SVDs agree. TIM8_TRGO appears twice in each
# table (TRG7/TRG8 regular, TRG9/TRG10 injected) - kept as-is from the SVD.

- match: '^STM32F7.*:ADC.*'
  triggers:
    - signal: ADC_EXT_TRG0
      source: TIM1_CC1
    - signal: ADC_EXT_TRG1
      source: TIM1_CC2
    - signal: ADC_EXT_TRG2
      source: TIM1_CC3
    - signal: ADC_EXT_TRG3
      source: TIM2_CC2
    - signal: ADC_EXT_TRG4
      source: TIM5_TRGO
    - signal: ADC_EXT_TRG5
      source: TIM4_CC4
    - signal: ADC_EXT_TRG6
      source: TIM3_CC4
    - signal: ADC_EXT_TRG7
      source: TIM8_TRGO
    - signal: ADC_EXT_TRG8
      source: TIM8_TRGO2
    - signal: ADC_EXT_TRG9
      source: TIM1_TRGO
    - signal: ADC_EXT_TRG10
      source: TIM1_TRGO2
    - signal: ADC_EXT_TRG11
      source: TIM2_TRGO
    - signal: ADC_EXT_TRG12
      source: TIM4_TRGO
    - signal: ADC_EXT_TRG13
      source: TIM6_TRGO
    - signal: ADC_EXT_TRG15
      source: EXTI11_TRG
    - signal: ADC_JEXT_TRG0
      source: TIM1_TRGO
    - signal: ADC_JEXT_TRG1
      source: TIM1_CC4
    - signal: ADC_JEXT_TRG2
      source: TIM2_TRGO
    - signal: ADC_JEXT_TRG3
      source: TIM2_CC1
    - signal: ADC_JEXT_TRG4
      source: TIM3_CC4
    - signal: ADC_JEXT_TRG5
      source: TIM4_TRGO
    - signal: ADC_JEXT_TRG7
      source: TIM8_CC4
    - signal: ADC_JEXT_TRG8
      source: TIM1_TRGO2
    - signal: ADC_JEXT_TRG9
      source: TIM8_TRGO
    - signal: ADC_JEXT_TRG10
      source: TIM8_TRGO2
    - signal: ADC_JEXT_TRG11
      source: TIM3_CC3
    - signal: ADC_JEXT_TRG12
      source: TIM5_TRGO
    - signal: ADC_JEXT_TRG13
      source: TIM3_CC1
    - signal: ADC_JEXT_TRG14
      source: TIM6_TRGO
