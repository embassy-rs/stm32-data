# Rule 93 of the original hand-maintained PERIPHERAL_TRIGGER_RULES table
# (stm32-data-gen/src/trigger.rs @ HEAD before the data-driven rewrite).
# Provenance: hand-written from the family reference manual.
# match: ^STM32F7(6|7).*:TIM8.*

- match: '^STM32F7(6|7).*:TIM8.*'
  triggers:
    - signal: TIMX_BRK_IN1
      source: DFSDM1_BREAK2
    - signal: TIMX_BRK_IN2
      source: DFSDM1_BREAK3
