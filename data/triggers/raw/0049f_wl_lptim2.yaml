# LPTIM2 interconnection inputs for STM32WL (WL5x + WLE5).
# Provenance: RM0461 (STM32WLEx) ch. 26 / RM0453 (STM32WL5x) ch. 28:
# - Table 182 "LPTIM2 external trigger connections"
# - LPTIM2_OR bits 1:0 (COMP1_OUT, COMP2_OUT, COMP1_OUT OR COMP2_OUT)

- match: '^STM32WL.*:LPTIM2'
  triggers:
    - signal: LPTIM_EXT_TRG0
      source: LPTIM2_ETR
    - signal: LPTIM_EXT_TRG1
      source: RTC_ALRA_TRG
    - signal: LPTIM_EXT_TRG2
      source: RTC_ALRB_TRG
    - signal: LPTIM_EXT_TRG3
      source: TAMP_TRG1
    - signal: LPTIM_EXT_TRG4
      source: TAMP_TRG2
    - signal: LPTIM_EXT_TRG5
      source: TAMP_TRG3
    - signal: LPTIM_EXT_TRG6
      source: COMP1_OUT
    - signal: LPTIM_EXT_TRG7
      source: COMP2_OUT
    - signal: LPTIM_IN1_MUX0
      source: LPTIM2_IN1
    - signal: LPTIM_IN1_MUX1
      source: COMP1_OUT
    - signal: LPTIM_IN1_MUX2
      source: COMP2_OUT
    - signal: LPTIM_IN1_MUX3
      source: COMP1_OUT_OR_COMP2_OUT
