# STM32WBA62/63/65 SPI1/SPI2 trigger inputs.
# Provenance: DEFERRED — RM0515 (STM32WBA6) chapters 39 (I2C), 40 (USART),
# 41 (LPUART) and 42 (SPI) are NOT on disk (folder stops at ch.36; the
# interconnect matrix in ch.16 references Table 413 "SPI interconnection
# (SPI1 and SPI2)" at a dead link). Content kept from the old hand rule,
# cross-checked against RM0493 (STM32WBA5) ch.41 Table 399 "SPI
# interconnection (SPI1)", which lists the identical 12 sources at the
# identical indices (gpdma1_chN_tc / exti4 / exti9 / lptim1_ch1 / lptim2_ch1
# / comp1_out / comp2_out / rtc_alra_trg / rtc_wut_trg). The tables must be
# re-verified once the WBA6 SPI chapter is available.
# match: ^STM32WBA6[235].*:SPI[12]

- match: '^STM32WBA6[235].*:SPI[12]'
  triggers:
    - signal: SPI_TRG0
      source: GPDMA_CH0_TC
    - signal: SPI_TRG1
      source: GPDMA_CH1_TC
    - signal: SPI_TRG2
      source: GPDMA_CH2_TC
    - signal: SPI_TRG3
      source: GPDMA_CH3_TC
    - signal: SPI_TRG4
      source: EXTI4_TRG
    - signal: SPI_TRG5
      source: EXTI9_TRG
    - signal: SPI_TRG6
      source: LPTIM1_CH1
    - signal: SPI_TRG7
      source: LPTIM2_CH1
    - signal: SPI_TRG8
      source: COMP1_OUT
    - signal: SPI_TRG9
      source: COMP2_OUT
    - signal: SPI_TRG10
      source: RTC_ALRA_TRG
    - signal: SPI_TRG11
      source: RTC_WUT_TRG
