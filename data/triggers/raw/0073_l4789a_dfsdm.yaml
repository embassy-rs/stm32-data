# Rule 73 of the original hand-maintained PERIPHERAL_TRIGGER_RULES table
# (stm32-data-gen/src/trigger.rs @ HEAD before the data-driven rewrite).
# Provenance: hand-written from the family reference manual.
# VERIFIED 2026 against RM0351 (STM32L47x-4Ax) Table 158 "DFSDM triggers
# connection" (11 inputs, jtrg[10:0]) — entries match exactly. EXTI stays
# plain per DFSDM convention; RM's TIM16_OC1 kept as-is (OC1 naming is the
# established DFSDM-rule precedent, see rules 0082/0098/0104).
# match: ^STM32L4(7|8|9|A).*:DFSDM.*

- match: '^STM32L4(7|8|9|A).*:DFSDM.*'
  triggers:
    - signal: DFSDM1_JTRG0
      source: TIM1_TRGO
    - signal: DFSDM1_JTRG1
      source: TIM1_TRGO2
    - signal: DFSDM1_JTRG2
      source: TIM8_TRGO
    - signal: DFSDM1_JTRG3
      source: TIM8_TRGO2
    - signal: DFSDM1_JTRG4
      source: TIM3_TRGO
    - signal: DFSDM1_JTRG5
      source: TIM4_TRGO
    - signal: DFSDM1_JTRG6
      source: TIM16_OC1
    - signal: DFSDM1_JTRG7
      source: TIM6_TRGO
    - signal: DFSDM1_JTRG8
      source: TIM7_TRGO
    - signal: DFSDM1_JTRG9
      source: EXTI11
    - signal: DFSDM1_JTRG10
      source: EXTI15
