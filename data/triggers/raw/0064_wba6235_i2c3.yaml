# STM32WBA62/63/65 I2C3 trigger inputs.
# Provenance: DEFERRED — RM0515 (STM32WBA6) ch.39 (I2C) is NOT on disk; the
# interconnect matrix in ch.16 references Table 372 "I2C3 interconnection" at
# a dead link. Content kept from the old hand rule, cross-checked against
# RM0493 (STM32WBA5) ch.38 Table 358 "I2C3 interconnection", which is
# identical (exti8 at TRG5; TRG7 Reserved — no LPTIM2_CH1 source on I2C3).
# Must be re-verified once the WBA6 I2C chapter is available.
# match: ^STM32WBA6[235].*:I2C3

- match: '^STM32WBA6[235].*:I2C3'
  triggers:
    - signal: I2C_TRG0
      source: GPDMA_CH0_TC
    - signal: I2C_TRG1
      source: GPDMA_CH1_TC
    - signal: I2C_TRG2
      source: GPDMA_CH2_TC
    - signal: I2C_TRG3
      source: GPDMA_CH3_TC
    - signal: I2C_TRG4
      source: EXTI5_TRG
    - signal: I2C_TRG5
      source: EXTI8_TRG
    - signal: I2C_TRG6
      source: LPTIM1_CH1
    - signal: I2C_TRG8
      source: COMP1_OUT
    - signal: I2C_TRG9
      source: COMP2_OUT
    - signal: I2C_TRG10
      source: RTC_ALRA_TRG
    - signal: I2C_TRG11
      source: RTC_WUT_TRG
