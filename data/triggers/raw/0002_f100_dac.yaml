# Extracted from the STM32F100 reference manual (RM0041), DAC chapter.
# SVD: stm32f100.svd enum values were suspect (TIM8_TRGO/TIM5_TRGO at
# indices 1/3 do not match the RM; F100 has no TIM8). RM0041 table 64 wins.
# TSEL[2:0] index 3 is "Timer 5 or Timer 15 TRGO event" (combined cell);
# on high-density value line TIM15 is selected via AFIO_MAPR2 MISC_REMAP.

- match: '^STM32F100.*:DAC.*'
  triggers:
    - signal: DAC_CHX_TRG0
      source: TIM6_TRGO
    - signal: DAC_CHX_TRG1
      source: TIM3_TRGO
    - signal: DAC_CHX_TRG2
      source: TIM7_TRGO
    - signal: DAC_CHX_TRG3
      source: TIM5_TRGO
    - signal: DAC_CHX_TRG3
      source: TIM15_TRGO
    - signal: DAC_CHX_TRG4
      source: TIM2_TRGO
    - signal: DAC_CHX_TRG5
      source: TIM4_TRGO
    - signal: DAC_CHX_TRG6
      source: EXTI9_TRG
