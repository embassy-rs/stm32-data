# DFSDM1 watchdog-break inputs of STM32H7A3/7B3/7B0 TIM1.
# NOT covered by any RM in tmp/rm (RM0433/RM0399 cover H743 and H745 only) —
# content kept from the original hand rules (break[0] -> TIM1 break, break[1] -> TIM1 break2).
# match: ^STM32H7(A3|B3|B0).*:TIM1.*

- match: '^STM32H7(A3|B3|B0).*:TIM1.*'
  triggers:
    - signal: TIMX_BRK_IN1
      source: DFSDM1_BREAK0
    - signal: TIMX_BRK_IN2
      source: DFSDM1_BREAK1
