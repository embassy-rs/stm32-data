# Rule 41 of the original hand-maintained PERIPHERAL_TRIGGER_RULES table
# (stm32-data-gen/src/trigger.rs @ HEAD before the data-driven rewrite).
# DEFERRED — no RM available on disk: the RM0481 extraction is truncated at
# chapter 15; the ADC chapter (ch. 26, Table 257 "ADC interconnection", which
# covers both EXTSEL and JEXTSEL) is not on disk, so the per-index values
# could not be re-verified. Content kept from the hand rules.
# Partially corroborated by RM0481 ch. 15 §15.3.2 (triggers to ADCs): source
# set for ADC1/2 is TIM2/3/4 (oc+trgo), TIM6, TIM1/8 (oc+trgo), TIM15,
# LPTIM1/2 (channels) and EXTI11/EXTI15 — consistent with the entries below.
# NOTE: the rule also matches ADC3 (H56x/57x), which RM0481 ch. 15 documents
# only via the same ADC1/2 table; ADC3-specific rows unverifiable on disk.
# match: ^STM32H5.*:ADC(1|2|3)

- match: '^STM32H5.*:ADC(1|2|3)'
  triggers:
    - signal: ADC_EXT_TRG0
      source: TIM1_CC1
    - signal: ADC_EXT_TRG1
      source: TIM1_CC2
    - signal: ADC_EXT_TRG2
      source: TIM1_CC3
    - signal: ADC_EXT_TRG3
      source: TIM2_CC2
    - signal: ADC_EXT_TRG4
      source: TIM3_TRGO
    - signal: ADC_EXT_TRG5
      source: TIM4_CC4
    - signal: ADC_EXT_TRG6
      source: EXTI11_TRG
    - signal: ADC_EXT_TRG7
      source: TIM8_TRGO
    - signal: ADC_EXT_TRG8
      source: TIM8_TRGO2
    - signal: ADC_EXT_TRG9
      source: TIM1_TRGO
    - signal: ADC_EXT_TRG10
      source: TIM1_TRGO2
    - signal: ADC_EXT_TRG11
      source: TIM2_TRGO
    - signal: ADC_EXT_TRG12
      source: TIM4_TRGO
    - signal: ADC_EXT_TRG13
      source: TIM6_TRGO
    - signal: ADC_EXT_TRG14
      source: TIM15_TRGO
    - signal: ADC_EXT_TRG15
      source: TIM3_CC4
    - signal: ADC_EXT_TRG16
      source: EXTI15_TRG
    - signal: ADC_EXT_TRG18
      source: LPTIM1_CH1
    - signal: ADC_EXT_TRG19
      source: LPTIM2_CH1
    - signal: ADC_JEXT_TRG0
      source: TIM1_TRGO
    - signal: ADC_JEXT_TRG1
      source: TIM1_CC4
    - signal: ADC_JEXT_TRG2
      source: TIM2_TRGO
    - signal: ADC_JEXT_TRG3
      source: TIM2_CC1
    - signal: ADC_JEXT_TRG4
      source: TIM3_CC4
    - signal: ADC_JEXT_TRG5
      source: TIM4_TRGO
    - signal: ADC_JEXT_TRG6
      source: EXTI15_TRG
    - signal: ADC_JEXT_TRG7
      source: TIM8_CC4
    - signal: ADC_JEXT_TRG8
      source: TIM1_TRGO2
    - signal: ADC_JEXT_TRG9
      source: TIM8_TRGO
    - signal: ADC_JEXT_TRG10
      source: TIM8_TRGO2
    - signal: ADC_JEXT_TRG11
      source: TIM3_CC3
    - signal: ADC_JEXT_TRG12
      source: TIM3_TRGO
    - signal: ADC_JEXT_TRG13
      source: TIM3_CC1
    - signal: ADC_JEXT_TRG14
      source: TIM6_TRGO
    - signal: ADC_JEXT_TRG15
      source: TIM15_TRGO
    - signal: ADC_JEXT_TRG18
      source: LPTIM1_CH1
    - signal: ADC_JEXT_TRG19
      source: LPTIM2_CH1
