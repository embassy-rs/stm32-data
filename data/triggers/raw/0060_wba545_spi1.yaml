# STM32WBA54/55 SPI1 trigger inputs.
# Provenance: RM0493 (STM32WBA5) ch.41 (SPI), Table 399 "SPI interconnection
# (SPI1)": spi_trg0..11 = gpdma1_ch0..3_tc, exti4, exti9, lptim1_ch1,
# lptim2_ch1, comp1_out, comp2_out, rtc_alra_trg, rtc_wut_trg; trg12..15
# Reserved. Verified against the RM; identical to the old hand rule.
# match: ^STM32WBA5[45].*:SPI1

- match: '^STM32WBA5[45].*:SPI1'
  triggers:
    - signal: SPI_TRG0
      source: GPDMA_CH0_TC
    - signal: SPI_TRG1
      source: GPDMA_CH1_TC
    - signal: SPI_TRG2
      source: GPDMA_CH2_TC
    - signal: SPI_TRG3
      source: GPDMA_CH3_TC
    - signal: SPI_TRG4
      source: EXTI4_TRG
    - signal: SPI_TRG5
      source: EXTI9_TRG
    - signal: SPI_TRG6
      source: LPTIM1_CH1
    - signal: SPI_TRG7
      source: LPTIM2_CH1
    - signal: SPI_TRG8
      source: COMP1_OUT
    - signal: SPI_TRG9
      source: COMP2_OUT
    - signal: SPI_TRG10
      source: RTC_ALRA_TRG
    - signal: SPI_TRG11
      source: RTC_WUT_TRG
