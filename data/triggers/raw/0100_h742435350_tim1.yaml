# DFSDM1 watchdog-break inputs of STM32H742/743/753/750 TIM1.
# Verified against RM0433 (H742/743/753/750) Table 251 "DFSDM break connection"
# (break[0] -> TIM1 break, break[1] -> TIM1 break2).
# match: ^STM32H7(42|43|53|50).*:TIM1.*

- match: '^STM32H7(42|43|53|50).*:TIM1.*'
  triggers:
    - signal: TIMX_BRK_IN1
      source: DFSDM1_BREAK0
    - signal: TIMX_BRK_IN2
      source: DFSDM1_BREAK1
