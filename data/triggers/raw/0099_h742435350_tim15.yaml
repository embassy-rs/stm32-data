# DFSDM1 watchdog-break inputs of STM32H742/743/753/750 TIM15.
# Verified against RM0433 (H742/743/753/750) Table 251 "DFSDM break connection"
# (break[0] -> TIM1 break / TIM15 break).
# match: ^STM32H7(42|43|53|50).*:TIM15.*

- match: '^STM32H7(42|43|53|50).*:TIM15.*'
  triggers:
    - signal: TIMX_BRK_IN1
      source: DFSDM1_BREAK0
