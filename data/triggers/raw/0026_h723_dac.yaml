# DAC channel trigger inputs, STM32H723/733/725/735/730.
# NOT covered by any RM in tmp/rm (RM0433 covers H742/743/753/750, RM0399 covers
# H745/755/747/757) — content kept from the original hand rules. Compared to the
# H743 table (RM0433 Table 227) the H72x/73x DAC drops TIM4/TIM5, adds
# HRTIM_DAC_TRG1/2 at index 9/10 and TIM23/24_TRGO at 14/15.
# match: ^STM32H7(2|3).*:DAC.*

- match: '^STM32H7(2|3).*:DAC.*'
  triggers:
    - signal: DAC_CHX_TRG1
      source: TIM1_TRGO
    - signal: DAC_CHX_TRG2
      source: TIM2_TRGO
    - signal: DAC_CHX_TRG3
      source: TIM4_TRGO
    - signal: DAC_CHX_TRG5
      source: TIM6_TRGO
    - signal: DAC_CHX_TRG6
      source: TIM7_TRGO
    - signal: DAC_CHX_TRG8
      source: TIM15_TRGO
    - signal: DAC_CHX_TRG9
      source: HRTIM_DAC_TRG1
    - signal: DAC_CHX_TRG10
      source: HRTIM_DAC_TRG2
    - signal: DAC_CHX_TRG11
      source: LPTIM1_TRGO
    - signal: DAC_CHX_TRG12
      source: LPTIM2_TRGO
    - signal: DAC_CHX_TRG13
      source: EXTI9_TRG
    - signal: DAC_CHX_TRG14
      source: TIM23_TRGO
    - signal: DAC_CHX_TRG15
      source: TIM24_TRGO
