# TIM17 interconnection inputs for STM32WL (WL5x + WLE5).
# Provenance: RM0461 (STM32WLEx) ch. 25 / RM0453 (STM32WL5x) ch. 27:
# - TIM17_OR1 bits 1:0 "TI1_RMP" (01: MSI, 10: HSE/32, 11: MCO)
# - TIM17_AF1 bit 1 "BKCMP1E", bit 2 "BKCMP2E" (COMP1_OUT, COMP2_OUT to BRK)

- match: '^STM32WL.*:TIM17'
  triggers:
    - signal: TIMX_TI1_IN1
      source: MSI
    - signal: TIMX_TI1_IN2
      source: HSE_DIV32
    - signal: TIMX_TI1_IN3
      source: MCO
    - signal: TIMX_BRK_IN1
      source: COMP1_OUT
    - signal: TIMX_BRK_IN2
      source: COMP2_OUT
