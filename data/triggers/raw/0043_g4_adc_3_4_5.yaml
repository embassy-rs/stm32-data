# ADC3/4/5 external triggers for STM32G4.
# Provenance: RM0440 (STM32G4) Table 168 "ADC3/4/5 - External triggers for
# regular channels" (incl. (continued)) and Table 169 "ADC3/4/5 - External
# triggers for injected channels" (incl. (continued)). Verified against the
# RM; content identical to the old hand rule. EXTSEL/JEXTSEL TRG31 is
# reserved in both tables and is omitted per conventions.
# RM names map: timX_ocN -> TIMX_CC{N}, EXTI line N -> EXTI{N}_TRG,
# lptim_out -> LPTIMOUT, hrtim_adc_trgN -> HRTIM_ADC_TRG{N}.
# match: ^STM32G4.*:ADC(3|4|5)

- match: '^STM32G4.*:ADC(3|4|5)'
  triggers:
    - signal: ADC_EXT_TRG0
      source: TIM3_CC1
    - signal: ADC_EXT_TRG1
      source: TIM2_CC3
    - signal: ADC_EXT_TRG2
      source: TIM1_CC3
    - signal: ADC_EXT_TRG3
      source: TIM8_CC1
    - signal: ADC_EXT_TRG4
      source: TIM3_TRGO
    - signal: ADC_EXT_TRG5
      source: EXTI2_TRG
    - signal: ADC_EXT_TRG6
      source: TIM4_CC1
    - signal: ADC_EXT_TRG7
      source: TIM8_TRGO
    - signal: ADC_EXT_TRG8
      source: TIM8_TRGO2
    - signal: ADC_EXT_TRG9
      source: TIM1_TRGO
    - signal: ADC_EXT_TRG10
