# STM32WBA54/55 TIM1 interconnection inputs.
# Provenance: RM0493 (STM32WBA5) ch.29 (TIM1): Table 255 (tim_ti1 inputs),
# Table 259 (tim_itr), Table 260 (tim_etr), Tables 261/262 (tim_brk /
# tim_brk2), Table 263 (tim_sys_brk), Table 264 (tim_ocref_clr). Verified
# against the RM. COMP1/COMP2 rows are footnoted "only available on
# STM32WBA54xx and STM32WBA55xx" — WBA52 (no COMP) is excluded by the match
# regex, so the COMP sources are valid for every chip this rule matches.
# CHANGE vs old hand rule: SYS_BRK_IN4 source was HSE2_HSECSS; RM0493 says
# "HSE32 lock Security System (HSECSS)" and the string "HSE2" does not occur
# anywhere in RM0493 -> corrected to HSE32_HSECSS.
# match: ^STM32WBA5[45].*:TIM1

- match: '^STM32WBA5[45].*:TIM1'
  triggers:
    - signal: TIMX_TI1_IN1
      source: COMP1_OUT
    - signal: TIMX_TI1_IN2
      source: COMP2_OUT
    - signal: TIMX_ITR_IN1
      source: TIM2_TRGO
    - signal: TIMX_ITR_IN2
      source: TIM3_TRGO
    - signal: TIMX_ITR_IN7
      source: TIM16_OC1
    - signal: TIMX_ITR_IN8
      source: TIM17_OC1
    - signal: TIMX_ETR_IN1
      source: COMP1_OUT
    - signal: TIMX_ETR_IN2
      source: COMP2_OUT
    - signal: TIMX_ETR_IN11
      source: ADC4_AWD1
    - signal: TIMX_ETR_IN12
      source: ADC4_AWD2
    - signal: TIMX_ETR_IN13
      source: ADC4_AWD3
    - signal: TIMX_BRK_IN1
      source: COMP1_OUT
    - signal: TIMX_BRK_IN2
      source: COMP2_OUT
    - signal: TIMX_BRK2_IN1
      source: COMP1_OUT
    - signal: TIMX_BRK2_IN2
      source: COMP2_OUT
    - signal: TIMX_SYS_BRK_IN0
      source: CORTEX_M33_LOCKUP
    - signal: TIMX_SYS_BRK_IN1
      source: PVD
    - signal: TIMX_SYS_BRK_IN2
      source: SRAM_PARITY_ERROR
    - signal: TIMX_SYS_BRK_IN3
      source: FLASH_ECC_ERROR
    - signal: TIMX_SYS_BRK_IN4
      source: HSE32_HSECSS
    - signal: TIMX_OCREF_CLR_IN0
      source: COMP1_OUT
    - signal: TIMX_OCREF_CLR_IN1
      source: COMP2_OUT
