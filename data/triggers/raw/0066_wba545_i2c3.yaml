# STM32WBA54/55 I2C3 trigger inputs.
# Provenance: RM0493 (STM32WBA5) ch.38 (I2C), Table 358 "I2C3
# interconnection": i2c_trg5 = exti8 (not exti9), and trg7 is Reserved —
# I2C3 has no LPTIM2_CH1 source; trg12..15 Reserved. Verified against the
# RM; identical to the old hand rule.
# match: ^STM32WBA5[45].*:I2C3

- match: '^STM32WBA5[45].*:I2C3'
  triggers:
    - signal: I2C_TRG0
      source: GPDMA_CH0_TC
    - signal: I2C_TRG1
      source: GPDMA_CH1_TC
    - signal: I2C_TRG2
      source: GPDMA_CH2_TC
    - signal: I2C_TRG3
      source: GPDMA_CH3_TC
    - signal: I2C_TRG4
      source: EXTI5_TRG
    - signal: I2C_TRG5
      source: EXTI8_TRG
    - signal: I2C_TRG6
      source: LPTIM1_CH1
    - signal: I2C_TRG8
      source: COMP1_OUT
    - signal: I2C_TRG9
      source: COMP2_OUT
    - signal: I2C_TRG10
      source: RTC_ALRA_TRG
    - signal: I2C_TRG11
      source: RTC_WUT_TRG
