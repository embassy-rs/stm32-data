# DFSDM2 injected trigger inputs, STM32H7A3/7B3/7B0 (DFSDM2 exists only on H7B3).
# NOT covered by any RM in tmp/rm (RM0433/RM0399 cover H743 and H745 only) —
# content kept from the original hand rules. EXTI sources are plain EXTI{n}
# (DFSDM convention).
# match: ^STM32H7(A3|B3|B0).*:DFSDM2.*

- match: '^STM32H7(A3|B3|B0).*:DFSDM2.*'
  triggers:
    - signal: DFSDM2_JTRG24
      source: EXTI11
    - signal: DFSDM2_JTRG25
      source: EXTI15
    - signal: DFSDM2_JTRG26
      source: LPTIM1_TRGO
    - signal: DFSDM2_JTRG27
      source: LPTIM2_TRGO
    - signal: DFSDM2_JTRG28
      source: LPTIM3_TRGO
    - signal: DFSDM2_JTRG29
      source: COMP1_OUT
    - signal: DFSDM2_JTRG30
      source: COMP2_OUT
