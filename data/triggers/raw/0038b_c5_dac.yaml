# STM32C5 DAC trigger selection, shared by the single- and dual-channel DACs.
# Source: STMicroelectronics stm32c5xx-drivers, ll/stm32c5xx_ll_dac.h,
# LL_DAC_TRIGGER_* definitions (TSEL1 bit values), checked 2026-11-05.
# https://github.com/STMicroelectronics/stm32c5xx-drivers/blob/main/ll/stm32c5xx_ll_dac.h

- match: '^STM32C5.*:DAC1$'
  triggers:
    - signal: DAC_CHX_TRG1
      source: TIM1_TRGO
    - signal: DAC_CHX_TRG2
      source: TIM2_TRGO
    - signal: DAC_CHX_TRG5
      source: TIM5_TRGO
    - signal: DAC_CHX_TRG6
      source: TIM6_TRGO
    - signal: DAC_CHX_TRG7
      source: TIM7_TRGO
    - signal: DAC_CHX_TRG8
      source: TIM8_TRGO
    - signal: DAC_CHX_TRG9
      source: TIM12_TRGO
    - signal: DAC_CHX_TRG10
      source: TIM15_TRGO
    - signal: DAC_CHX_TRG11
      source: LPTIM1_CH1
    - signal: DAC_CHX_TRG12
      source: EXTI9_TRG
