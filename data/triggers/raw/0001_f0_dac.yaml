# DAC external triggers, STM32F0 (F0x1/F0x2/F0x8; F0x0 has no DAC).
# RM0091 (STM32F0x1/0x2/0x8) Table 52 "External triggers" (DAC chapter).
# Matches SVD DAC_CR TSEL1/TSEL2 enums for stm32f0x1/f0x2/f0x8.
# NOTE: TIM7 exists only on F0x1/F0x2/F0x8 (all covered here); EXTI9_TRG is
# the EXTI line 9 source (TSEL=110). TSEL=101 is Reserved, 111 is SWTRIG.
# match: ^STM32F0.*:DAC.*

- match: '^STM32F0.*:DAC.*'
  triggers:
    - signal: DAC_CHX_TRG0
      source: TIM6_TRGO
    - signal: DAC_CHX_TRG1
      source: TIM3_TRGO
    - signal: DAC_CHX_TRG2
      source: TIM7_TRGO
    - signal: DAC_CHX_TRG3
      source: TIM15_TRGO
    - signal: DAC_CHX_TRG4
      source: TIM2_TRGO
    - signal: DAC_CHX_TRG6
      source: EXTI9_TRG
