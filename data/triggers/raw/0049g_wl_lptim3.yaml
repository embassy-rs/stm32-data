# LPTIM3 interconnection inputs for STM32WL (WL5x + WLE5).
# Provenance: RM0461 (STM32WLEx) ch. 26 / RM0453 (STM32WL5x) ch. 28:
# - Table 183 "LPTIM3 external trigger connections"
# - LPTIM3_OR bits 1:0 (COMP1_OUT, COMP2_OUT, COMP1_OUT OR COMP2_OUT)

- match: '^STM32WL.*:LPTIM3'
  triggers:
    - signal: LPTIM_EXT_TRG0
      source: LPTIM3_ETR
    - signal: LPTIM_EXT_TRG1
      source: LPTIM1_TRGO
    - signal: LPTIM_EXT_TRG2
      source: LPTIM2_TRGO
    - signal: LPTIM_IN1_MUX0
      source: LPTIM3_IN1
    - signal: LPTIM_IN1_MUX1
      source: COMP1_OUT
    - signal: LPTIM_IN1_MUX2
      source: COMP2_OUT
    - signal: LPTIM_IN1_MUX3
      source: COMP1_OUT_OR_COMP2_OUT
