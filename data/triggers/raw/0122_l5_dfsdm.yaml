# DFSDM1 injected trigger inputs, STM32L5 (L552/L562).
# RM0438 (STM32L5xx) Table 209 "DFSDM triggers connection" (DFSDM chapter, 26).
# dfsdm_jtrg[23:9] and [31:27] are Reserved (unbonded, omitted). "LPTIMER1" in
# the RM maps to LPTIM1_TRGO per CONVENTIONS.md. EXTI sources are plain
# EXTI{n} (DFSDM convention, no _TRG suffix).
# match: ^STM32L5.*:DFSDM.*

- match: '^STM32L5.*:DFSDM.*'
  triggers:
    - signal: DFSDM1_JTRG0
      source: TIM1_TRGO
    - signal: DFSDM1_JTRG1
      source: TIM1_TRGO2
    - signal: DFSDM1_JTRG2
      source: TIM8_TRGO
    - signal: DFSDM1_JTRG3
      source: TIM8_TRGO2
    - signal: DFSDM1_JTRG24
      source: EXTI11
    - signal: DFSDM1_JTRG25
      source: EXTI15
    - signal: DFSDM1_JTRG26
      source: LPTIM1_TRGO
