# DAC2 external and sawtooth triggers for STM32G4.
# Provenance: RM0440 (STM32G4) Table 187 "DAC2 interconnection" (incl. (continued)). The DAC chapter has one
# "interconnection" table per DAC instance covering all three trigger muxes:
# dac_chx_trgN = normal trigger TSELx[3:0] (DAC_CHX_TRG{N}),
# dac_chx_trg9..14 = sawtooth reset trigger STRSTTRIGSELx (HRTIM-only),
# dac_inc_chx_trgN = sawtooth increment trigger STINCTRIGSELx.
# RM names map: EXTI9/EXTI10 -> EXTI{9,10}_TRG, hrtim_dac_trgN ->
# HRTIM_DAC_TRG{N}, hrtim_dac_reset_trgN -> HRTIM_DAC_RESET_TRG{N},
# hrtim_dac_step_trgN -> HRTIM_DAC_STEP_TRG{N}.
# TSELx = 0 (software trigger) is omitted per conventions. Verified against
# the RM; content identical to the old hand rule.
# match: ^STM32G4.*:DAC2

- match: '^STM32G4.*:DAC2'
  triggers:
    - signal: DAC_CHX_TRG1
      source: TIM8_TRGO
    - signal: DAC_CHX_TRG2
      source: TIM7_TRGO
    - signal: DAC_CHX_TRG3
      source: TIM15_TRGO
    - signal: DAC_CHX_TRG4
      source: TIM2_TRGO
    - signal: DAC_CHX_TRG5
      source: TIM4_TRGO
    - signal: DAC_CHX_TRG6
      source: EXTI9_TRG
    - signal: DAC_CHX_TRG7
      source: TIM6_TRGO
    - signal: DAC_CHX_TRG8
      source: TIM3_TRGO
    - signal: DAC_CHX_TRG9
      source: HRTIM_DAC_RESET_TRG1
    - signal: DAC_CHX_TRG10
      source: HRTIM_DAC_RESET_TRG2
    - signal: DAC_CHX_TRG11
      source: HRTIM_DAC_RESET_TRG3
    - signal: DAC_CHX_TRG12
      source: HRTIM_DAC_RESET_TRG4
    - signal: DAC_CHX_TRG13
      source: HRTIM_DAC_RESET_TRG5
    - signal: DAC_CHX_TRG14
      source: HRTIM_DAC_RESET_TRG6
    - signal: DAC_CHX_TRG15
      source: HRTIM_DAC_TRG2
    - signal: DAC_INC_CHX_TRG1
      source: TIM8_TRGO
    - signal: DAC_INC_CHX_TRG2
      source: TIM7_TRGO
    - signal: DAC_INC_CHX_TRG3
      source: TIM15_TRGO
    - signal: DAC_INC_CHX_TRG4
      source: TIM2_TRGO
    - signal: DAC_INC_CHX_TRG5
      source: TIM4_TRGO
    - signal: DAC_INC_CHX_TRG6
      source: EXTI10_TRG
    - signal: DAC_INC_CHX_TRG7
      source: TIM6_TRGO
    - signal: DAC_INC_CHX_TRG8
      source: TIM3_TRGO
    - signal: DAC_INC_CHX_TRG9
      source: HRTIM_DAC_STEP_TRG1
    - signal: DAC_INC_CHX_TRG10
      source: HRTIM_DAC_STEP_TRG2
    - signal: DAC_INC_CHX_TRG11
      source: HRTIM_DAC_STEP_TRG3
    - signal: DAC_INC_CHX_TRG12
      source: HRTIM_DAC_STEP_TRG4
    - signal: DAC_INC_CHX_TRG13
      source: HRTIM_DAC_STEP_TRG5
    - signal: DAC_INC_CHX_TRG14
      source: HRTIM_DAC_STEP_TRG6
