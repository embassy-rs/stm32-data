# Verified against RM0503 (STM32U0), TIM1 chapter, §23.4.29 "TIM1 timer input
# selection register (TIM1_TISEL)": TI1SEL[3:0] 0001 = COMP1 output
# (tim_ti1_in1), TI2SEL[3:0] 0001 = COMP2 output (tim_ti2_in1).
# TI3/TI4SEL have no internal sources. No numbered table; register bit
# descriptions are the source of truth. Matches the original hand rule exactly
# — content unchanged.
# match: ^STM32U0.*:TIM1

- match: '^STM32U0.*:TIM1'
  triggers:
    - signal: TIMX_TI1_IN1
      source: COMP1_OUT
    - signal: TIMX_TI2_IN1
      source: COMP2_OUT
