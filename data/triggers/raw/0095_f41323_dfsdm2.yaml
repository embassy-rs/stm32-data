# Rule 95 of the original hand-maintained PERIPHERAL_TRIGGER_RULES table
# (stm32-data-gen/src/trigger.rs @ HEAD before the data-driven rewrite).
# Provenance: hand-written from the family reference manual.
# match: ^STM32F4(13|23).*:DFSDM2.*

- match: '^STM32F4(13|23).*:DFSDM2.*'
  triggers:
    - signal: DFSDM2_JTRG0
      source: TIM1_TRGO
    - signal: DFSDM2_JTRG1
      source: TIM3_TRGO
    - signal: DFSDM2_JTRG2
      source: TIM8_TRGO
    - signal: DFSDM2_JTRG3
      source: TIM10_OC1
    - signal: DFSDM2_JTRG4
      source: TIM2_TRGO
    - signal: DFSDM2_JTRG5
      source: TIM4_TRGO
    - signal: DFSDM2_JTRG6
      source: TIM11_OC1
    - signal: DFSDM2_JTRG7
      source: TIM6_TRGO
    - signal: DFSDM2_JTRG8
      source: TIM7_TRGO
    - signal: DFSDM2_JTRG9
      source: EXTI11
    - signal: DFSDM2_JTRG10
      source: EXTI15
